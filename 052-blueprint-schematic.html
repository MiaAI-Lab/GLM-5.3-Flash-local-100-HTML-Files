<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLUEPRINT NO.7 — Aerostat Mk.VII General Arrangement</title>
<style>
  :root {
    --blue-deep: #0d2b45;
    --blue-mid: #123a5c;
    --blue-lite: #164267;
    --line: #eaf3ff;
    --dim-col: #9fc2e8;
    --faint: rgba(234, 243, 255, 0.28);
    --ghost: rgba(234, 243, 255, 0.12);
    --stamp: #c0392b;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", "Courier New", monospace;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  ::selection {
    background: rgba(159, 194, 232, 0.35);
    color: #f6faff;
  }

  html {
    scrollbar-color: #2a5785 var(--blue-deep);
    scrollbar-width: thin;
  }

  ::-webkit-scrollbar {
    height: 10px;
    width: 10px;
  }

  ::-webkit-scrollbar-track {
    background: #0a2136;
  }

  ::-webkit-scrollbar-thumb {
    background: #2a5785;
    border: 2px solid #0a2136;
    border-radius: 5px;
  }

  body {
    min-height: 100vh;
    background:
      linear-gradient(rgba(159, 194, 232, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(159, 194, 232, 0.05) 1px, transparent 1px),
      radial-gradient(120% 90% at 50% 0%, #123a5c 0%, #0d2b45 55%, #081d31 100%);
    background-size: 34px 34px, 34px 34px, auto;
    color: var(--line);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(10px, 2.2vw, 26px);
  }

  .bar {
    width: min(1520px, 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .bar .idblock {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .bar .job {
    font-size: clamp(11px, 1.4vw, 13px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--line);
  }

  .bar .sub {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim-col);
  }

  .togs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tog {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(18, 58, 92, 0.55);
    border: 1px solid rgba(159, 194, 232, 0.35);
    color: var(--line);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 9px 13px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
    min-height: 40px;
  }

  .tog:hover,
  .tog:focus-visible {
    border-color: rgba(234, 243, 255, 0.85);
    background: rgba(22, 66, 103, 0.75);
    outline: none;
  }

  .tog .led {
    width: 9px;
    height: 9px;
    border: 1px solid var(--line);
    background: var(--line);
    box-shadow: 0 0 8px rgba(234, 243, 255, 0.5);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .tog[aria-pressed="false"] .led {
    background: transparent;
    box-shadow: none;
  }

  .wrap {
    width: min(1520px, 100%);
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .sheet {
    position: relative;
    width: 100%;
    min-width: 900px;
    max-width: 1500px;
    aspect-ratio: 14 / 9;
    margin: 0 auto;
    background:
      radial-gradient(140% 110% at 50% 0%, var(--blue-lite) 0%, var(--blue-mid) 48%, var(--blue-deep) 100%);
    border: 1px solid rgba(234, 243, 255, 0.4);
    box-shadow: 0 30px 80px rgba(2, 10, 20, 0.55), 0 4px 18px rgba(2, 10, 20, 0.4);
    cursor: crosshair;
    animation: expose 2.1s ease-out both;
  }

  .sheet.reexpose {
    animation: expose 1.4s ease-out both;
  }

  @keyframes expose {
    0% {
      filter: brightness(2.6) blur(7px) saturate(0.4);
      opacity: 0.35;
    }
    38% {
      opacity: 1;
    }
    100% {
      filter: none;
      opacity: 1;
    }
  }

  .sheet svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  svg text {
    font-family: var(--mono);
    fill: var(--line);
  }

  svg .serif {
    font-family: var(--serif);
  }

  svg .dimtxt {
    fill: var(--dim-col);
    font-size: 12px;
    letter-spacing: 0.12em;
  }

  svg .fine {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    fill: var(--dim-col);
  }

  svg .lab {
    font-size: 12.5px;
    letter-spacing: 0.16em;
  }

  svg .micro {
    font-size: 9px;
    letter-spacing: 0.2em;
    fill: rgba(234, 243, 255, 0.6);
  }

  .layer {
    transition: opacity 0.35s ease;
  }

  svg.no-dims #dimLayer,
  svg.no-hidden #hiddenLayer,
  svg.no-grid #gridLayer {
    opacity: 0 !important;
  }

  .part {
    cursor: pointer;
    transition: transform 0.45s cubic-bezier(0.22, 0.9, 0.3, 1.15), opacity 0.3s ease;
    transform: translate(0, 0);
  }

  .part .callout {
    opacity: 0;
    transition: opacity 0.3s ease 0.12s;
  }

  .part:hover,
  .part.active {
    transform: translate(var(--lx, 0px), var(--ly, 0px));
  }

  .part:hover .callout,
  .part.active .callout {
    opacity: 1;
  }

  .sheet.focus .part:not(.active) {
    opacity: 0.34;
  }

  .sheet.focus .layer:not(#artLayer) {
    opacity: 0.3;
  }

  .sheet.focus svg.no-grid #gridLayer,
  .sheet.focus svg.no-dims #dimLayer,
  .sheet.focus svg.no-hidden #hiddenLayer {
    opacity: 0 !important;
  }

  .rowlit {
    fill: rgba(234, 243, 255, 0.1) !important;
  }

  .xhair {
    position: absolute;
    background: rgba(234, 243, 255, 0.34);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .xhair.v {
    top: 0;
    bottom: 0;
    width: 1px;
  }

  .xhair.h {
    left: 0;
    right: 0;
    height: 1px;
  }

  .sheet.tracking .xhair {
    opacity: 1;
  }

  .chip {
    position: absolute;
    pointer-events: none;
    background: rgba(8, 26, 43, 0.85);
    border: 1px solid rgba(159, 194, 232, 0.5);
    color: var(--line);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    padding: 4px 8px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 3;
  }

  .sheet.tracking .chip {
    opacity: 1;
  }

  .flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 100% at 50% 40%, rgba(244, 250, 255, 0.98), rgba(214, 233, 250, 0.9));
    opacity: 0;
  }

  .flash.go {
    animation: reflash 0.9s ease-out;
  }

  @keyframes reflash {
    0% {
      opacity: 0.95;
    }
    100% {
      opacity: 0;
    }
  }

  .foot {
    width: min(1520px, 100%);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim-col);
  }

  .foot .key {
    color: var(--line);
  }

  @media (prefers-reduced-motion: reduce) {
    .sheet,
    .sheet.reexpose {
      animation: none;
    }
    .flash.go {
      animation: none;
      opacity: 0;
    }
    .part,
    .layer,
    .callout {
      transition-duration: 0.01s;
    }
  }
</style>
</head>

<script>
(() => {
  'use strict';

  const sheet = document.getElementById('sheet');
  const svg = document.getElementById('bp');
  const xv = document.getElementById('xv');
  const xh = document.getElementById('xh');
  const chip = document.getElementById('chip');
  const flash = document.getElementById('flash');
  const togDims = document.getElementById('togDims');
  const togHidden = document.getElementById('togHidden');
  const togGrid = document.getElementById('togGrid');
  const VB_W = 1400;
  const VB_H = 900;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- layer toggles ---------- */

  function bindToggle(btn, cls) {
    btn.addEventListener('click', () => {
      const on = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', on ? 'false' : 'true');
      svg.classList.toggle(cls, on);
    });
  }

  bindToggle(togDims, 'no-dims');
  bindToggle(togHidden, 'no-hidden');
  bindToggle(togGrid, 'no-grid');

  /* ---------- focus + BOM sync ---------- */

  const parts = Array.prototype.slice.call(svg.querySelectorAll('.part'));
  const rows = Array.prototype.slice.call(svg.querySelectorAll('.bomrow'));

  function activate(id) {
    parts.forEach((p) => {
      const on = p.id === 'p' + id;
      p.classList.toggle('active', on);
      p.style.zIndex = on ? '5' : '';
    });
    rows.forEach((r) => r.classList.toggle('rowlit', r.getAttribute('data-part') === id));
    sheet.classList.add('focus');
  }

  function deactivate() {
    parts.forEach((p) => {
      p.classList.remove('active');
      p.style.zIndex = '';
    });
    rows.forEach((r) => r.classList.remove('rowlit'));
    sheet.classList.remove('focus');
  }

  parts.forEach((p) => {
    p.addEventListener('mouseenter', () => activate(p.getAttribute('data-part')));
    p.addEventListener('mouseleave', deactivate);
    p.addEventListener('focus', () => activate(p.getAttribute('data-part')));
    p.addEventListener('blur', deactivate);
  });

  rows.forEach((r) => {
    r.addEventListener('mouseenter', () => activate(r.getAttribute('data-part')));
    r.addEventListener('mouseleave', deactivate);
  });

  /* ---------- drafting crosshair ---------- */

  let rect = null;

  function cacheRect() {
    rect = sheet.getBoundingClientRect();
  }

  function track(e) {
    if (!rect) cacheRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    if (px < 0 || py < 0 || px > rect.width || py > rect.height) {
      sheet.classList.remove('tracking');
      return;
    }
    sheet.classList.add('tracking');
    xv.style.left = px + 'px';
    xh.style.top = py + 'px';
    const sx = Math.round((px / rect.width) * VB_W);
    const sy = Math.round((py / rect.height) * VB_H);
    chip.textContent = 'X ' + String(sx).padStart(4, '0') + ' · Y ' + String(sy).padStart(4, '0');
    const flipX = px > rect.width - 150;
    const flipY = py > rect.height - 60;
    chip.style.left = (flipX ? px - chip.offsetWidth - 14 : px + 14) + 'px';
    chip.style.top = (flipY ? py - chip.offsetHeight - 10 : py + 12) + 'px';
  }

  sheet.addEventListener('pointerenter', cacheRect);
  sheet.addEventListener('pointermove', track);
  sheet.addEventListener('pointerleave', () => sheet.classList.remove('tracking'));
  window.addEventListener('resize', cacheRect);
  window.addEventListener('scroll', () => { rect = null; }, { passive: true });

  if (window.matchMedia('(pointer: coarse)').matches) {
    sheet.style.cursor = 'default';
  }

  /* ---------- re-expose on empty-paper click ---------- */

  sheet.addEventListener('click', (e) => {
    if (e.target.closest('.part') || e.target.closest('button')) return;
    if (reduceMotion) return;
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');
  });
})();
</script>
</body>
</html>
