<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BREATHE — a 4·7·8 guided breathing ritual</title>
<style>
/* ============================================================
   BREATHE — a 4·7·8 ritual
   dawn gradients · soft orb · ripple rings · whisper phases
   ============================================================ */
*,
*::before,
*::after { box-sizing: border-box; }

:root {
  --dawn-1: #f7e8e4;
  --dawn-2: #dce9f5;
  --dawn-mid: #efe3ec;
  --peach: #ffc7b8;
  --peach-deep: #f0a493;
  --lav: #c9b8ff;
  --lav-deep: #a99aee;
  --ink: #6b5f58;
  --ink-soft: #a3968d;
  --ink-faint: #c6bab0;
  --paper: rgba(255, 255, 255, 0.55);
  --hairline: rgba(107, 95, 88, 0.22);
  --dim: 0;
  --ease-ritual: cubic-bezier(0.45, 0.05, 0.35, 0.95);
}

html { height: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-weight: 300;
  color: var(--ink);
  background: linear-gradient(168deg, var(--dawn-1) 0%, var(--dawn-mid) 46%, var(--dawn-2) 100%) fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(201, 184, 255, 0.55); color: #43394f; }
::-moz-selection { background: rgba(201, 184, 255, 0.55); color: #43394f; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.3); }
::-webkit-scrollbar-thumb {
  background: linear-gradient(var(--peach), var(--lav));
  border-radius: 6px;
  border: 2px solid rgba(255, 255, 255, 0.5);
}

/* ---------- sky ---------- */
.sky {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
}
.sky::before,
.sky::after {
  content: "";
  position: absolute;
  border-radius: 50%;
}
.sky::before {
  width: 72vmax;
  height: 72vmax;
  left: -22vmax;
  top: -26vmax;
  background: radial-gradient(circle at 50% 50%, rgba(255, 199, 184, 0.55), rgba(255, 199, 184, 0) 66%);
}
.sky::after {
  width: 66vmax;
  height: 66vmax;
  right: -20vmax;
  bottom: -24vmax;
  background: radial-gradient(circle at 50% 50%, rgba(201, 184, 255, 0.5), rgba(201, 184, 255, 0) 66%);
}
.mote {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 8px rgba(255, 236, 224, 0.9);
  opacity: 0.5;
  animation: drift 26s ease-in-out infinite alternate;
}
.m1 { left: 12%; top: 30%; animation-delay: -3s; }
.m2 { left: 22%; top: 66%; animation-delay: -9s; width: 3px; height: 3px; }
.m3 { left: 68%; top: 22%; animation-delay: -14s; }
.m4 { left: 82%; top: 58%; animation-delay: -6s; width: 3px; height: 3px; }
.m5 { left: 46%; top: 82%; animation-delay: -19s; }
.m6 { left: 88%; top: 12%; animation-delay: -11s; width: 3px; height: 3px; }
@keyframes drift {
  from { transform: translate3d(0, 0, 0); opacity: 0.25; }
  50%  { opacity: 0.7; }
  to   { transform: translate3d(2.5vw, -3vh, 0); opacity: 0.3; }
}

.dim-veil {
  position: fixed;
  inset: 0;
  background: #171310;
  opacity: calc(var(--dim) * 0.52);
  pointer-events: none;
  transition: opacity 0.6s ease;
  z-index: 40;
}

/* ---------- frame ---------- */
.frame {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: clamp(16px, 3.2vw, 42px) clamp(18px, 4vw, 56px);
  position: relative;
  z-index: 1;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 18px;
  flex-wrap: wrap;
}

.brand {
  margin: 0;
  font-size: clamp(1.05rem, 2.6vw, 1.4rem);
  font-weight: 200;
  letter-spacing: 0.52em;
  text-transform: uppercase;
  color: var(--ink);
  text-indent: 0.52em; /* optically recenters tracked caps */
}
.sub {
  margin: 0.5em 0 0;
  font-size: 0.66rem;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.meta {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.meta b { font-weight: 500; color: var(--ink); }
.dots { display: inline-flex; gap: 8px; align-items: center; }
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(107, 95, 88, 0.18);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}
.dot.on {
  background: var(--peach-deep);
  box-shadow: 0 0 10px rgba(240, 164, 147, 0.85);
}

/* ---------- stage ---------- */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 2.6vh, 30px);
  padding: clamp(14px, 3vh, 34px) 0;
}

.orb-theatre {
  position: relative;
  width: min(76vmin, 540px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}
.halo {
  position: absolute;
  inset: -14%;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 231, 216, 0.95) 0%,
    rgba(201, 184, 255, 0.32) 46%,
    rgba(201, 184, 255, 0) 72%);
  filter: blur(26px);
  opacity: 0.85;
  transition: opacity 0.9s ease, transform 0.9s var(--ease-ritual);
}
.holding .halo { opacity: 1; transform: scale(1.06); }
.ripples { position: absolute; inset: 0; pointer-events: none; }
.ripple {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(169, 154, 238, 0.65);
  animation: ripple 3.4s var(--ease-ritual) forwards;
}
@keyframes ripple {
  from { transform: scale(var(--from, 0.9)); opacity: 0.6; }
  to   { transform: scale(1.9); opacity: 0; }
}

.orb {
  position: relative;
  width: 56%;
  aspect-ratio: 1;
  border: 0;
  padding: 0;
  border-radius: 50%;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  background: radial-gradient(circle at 32% 26%,
    #fff7f2 0%,
    var(--peach) 38%,
    var(--peach-deep) 66%,
    var(--lav-deep) 112%);
  box-shadow:
    0 34px 90px -22px rgba(240, 164, 147, 0.6),
    0 10px 34px rgba(201, 184, 255, 0.35),
    inset 0 -16px 44px rgba(169, 154, 238, 0.4),
    inset 0 12px 26px rgba(255, 255, 255, 0.75);
  transform: scale(var(--scale, 0.62));
  will-change: transform;
  transition: box-shadow 0.5s ease;
  font: inherit;
  color: inherit;
}
.orb:hover { box-shadow:
  0 40px 100px -20px rgba(240, 164, 147, 0.7),
  0 12px 40px rgba(201, 184, 255, 0.45),
  inset 0 -16px 44px rgba(169, 154, 238, 0.4),
  inset 0 12px 26px rgba(255, 255, 255, 0.8);
}
.orb:focus-visible {
  outline: 2px solid var(--lav-deep);
  outline-offset: 10px;
}
.orb .gloss {
  position: absolute;
  left: 17%;
  top: 11%;
  width: 36%;
  height: 23%;
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
  filter: blur(2px);
  transform: rotate(-18deg);
  pointer-events: none;
}
.orb .core {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 64% 72%, rgba(255, 255, 255, 0.3), transparent 44%);
  mix-blend-mode: screen;
  pointer-events: none;
}
.orb-count {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(2rem, 7vmin, 3.4rem);
  font-weight: 200;
  letter-spacing: 0.08em;
  color: rgba(255, 255, 255, 0.9);
  text-shadow: 0 1px 3px rgba(120, 80, 70, 0.25);
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.running .orb-count { opacity: 1; }

.shimmer {
  position: absolute;
  inset: -6%;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.95);
  box-shadow:
    0 0 26px rgba(255, 255, 255, 0.9),
    inset 0 0 26px rgba(255, 255, 255, 0.75);
  opacity: var(--shimmer, 0);
  transform: scale(calc(1 + var(--shimmer, 0) * 0.06));
  pointer-events: none;
}

.phraseline { text-align: center; }
.phase-word {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.8rem, 5.2vw, 3rem);
  letter-spacing: 0.02em;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
  transition: opacity 0.4s ease;
}
.phase-sub {
  margin: 0.6em 0 0;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(0.8rem, 1.6vw, 0.95rem);
  color: var(--ink-soft);
}

/* ---------- rhythm bar ---------- */
.rhythm {
  display: grid;
  grid-template-columns: auto 4fr auto 7fr auto 8fr;
  gap: 10px;
  align-items: center;
  width: min(560px, 88vw);
}
.r-num {
  font-size: 0.66rem;
  letter-spacing: 0.2em;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.seg {
  height: 3px;
  border-radius: 3px;
  background: rgba(107, 95, 88, 0.14);
  overflow: hidden;
}
.seg i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--peach), var(--lav));
}

/* ---------- controls ---------- */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: clamp(12px, 2vw, 22px);
  padding-top: clamp(10px, 2vh, 22px);
}
.btn {
  font: inherit;
  font-size: 0.7rem;
  font-weight: 400;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink);
  padding: 0.9em 1.7em 0.9em 2em;
  border-radius: 999px;
  border: 1px solid var(--hairline);
  background: var(--paper);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.65em;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  min-height: 44px;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px -14px rgba(107, 95, 88, 0.5);
  background: rgba(255, 255, 255, 0.85);
}
.btn:active { transform: translateY(0) scale(0.97); }
.btn:focus-visible {
  outline: 2px solid var(--lav-deep);
  outline-offset: 3px;
}
.btn.primary {
  background: linear-gradient(135deg, var(--peach), var(--lav));
  border-color: transparent;
  color: #4d4140;
  font-weight: 500;
}
.btn.primary:hover { filter: saturate(1.12); }
.btn[aria-pressed="true"] { background: rgba(201, 184, 255, 0.4); }
.btn svg { flex: none; }

.dim-control {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 0.7rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-soft);
  min-height: 44px;
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: clamp(110px, 18vw, 180px);
  height: 24px;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--peach), var(--lav));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -7px;
  border-radius: 50%;
  background: #fffdfb;
  border: 1px solid rgba(107, 95, 88, 0.35);
  box-shadow: 0 2px 8px rgba(107, 95, 88, 0.3);
}
input[type="range"]::-moz-range-track {
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--peach), var(--lav));
}
input[type="range"]::-moz-range-thumb {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #fffdfb;
  border: 1px solid rgba(107, 95, 88, 0.35);
  box-shadow: 0 2px 8px rgba(107, 95, 88, 0.3);
}
input[type="range"]:focus-visible { outline: 2px solid var(--lav-deep); outline-offset: 4px; }

.hint {
  width: 100%;
  text-align: center;
  margin: 4px 0 0;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: 0.8rem;
  color: var(--ink-faint);
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .mote { animation: none; opacity: 0.35; }
  .ripple { animation-duration: 7s; }
  .orb { transform: none !important; transition: opacity 0.9s ease; }
  .shimmer { transform: none; }
  .halo, .btn { transition-duration: 0.01s; }
}

@media (max-width: 480px) {
  .meta { gap: 10px; font-size: 0.62rem; }
  .btn { padding: 0.8em 1.3em 0.8em 1.6em; letter-spacing: 0.26em; }
  .rhythm { width: 94vw; }
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <i class="mote m1"></i><i class="mote m2"></i><i class="mote m3"></i>
  <i class="mote m4"></i><i class="mote m5"></i><i class="mote m6"></i>
</div>
<div class="dim-veil" aria-hidden="true"></div>

<div class="frame">
  <header class="top">
    <div>
      <h1 class="brand">Breathe</h1>
      <p class="sub">the 4 · 7 · 8 ritual</p>
    </div>
    <div class="meta">
      <span>Cycle <b id="cycleNum">01</b></span>
      <span class="dots" id="dots" aria-hidden="true">
        <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
      </span>
    </div>
  </header>

  <main class="stage">
    <div class="orb-theatre" id="theatre">
      <div class="halo" aria-hidden="true"></div>
      <div class="ripples" id="ripples" aria-hidden="true"></div>
      <button class="orb" id="orb" type="button"
              aria-label="Breathing orb. While the ritual runs, press and hold to rest at the top of your breath.">
        <span class="gloss" aria-hidden="true"></span>
        <span class="core" aria-hidden="true"></span>
        <span class="orb-count" id="orbCount" aria-hidden="true"></span>
      </button>
      <div class="shimmer" aria-hidden="true"></div>
    </div>

    <div class="phraseline">
      <p class="phase-word" id="phaseWord" aria-live="polite">Breathe with the light</p>
      <p class="phase-sub" id="phaseHint">a slow rhythm — four in, seven held, eight out</p>
    </div>

    <section class="rhythm" aria-label="Breathing rhythm map">
      <span class="r-num">4</span><div class="seg"><i id="fillI"></i></div>
      <span class="r-num">7</span><div class="seg"><i id="fillH"></i></div>
      <span class="r-num">8</span><div class="seg"><i id="fillE"></i></div>
    </section>
  </main>

  <footer class="controls">
    <button class="btn primary" id="beginBtn" type="button">Begin</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/>
        <path d="M11 5.2c1.3 1.1 1.3 4.5 0 5.6" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M13.2 3.4c2.1 2.2 2.1 7 0 9.2" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
      </svg>
      <span id="soundLabel">Sound off</span>
    </button>
    <label class="dim-control">Dim
      <input type="range" id="dimRange" min="0" max="100" value="0" aria-label="Dim the room">
    </label>
    <p class="hint">Hold the orb to rest at the top of a breath — the light will shimmer with you.</p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var orb = $('orb');
  var theatre = $('theatre');
  var orbCount = $('orbCount');
  var wordEl = $('phaseWord');
  var hintEl = $('phaseHint');
  var ripplesEl = $('ripples');
  var cycleEl = $('cycleNum');
  var dots = Array.prototype.slice.call(document.querySelectorAll('#dots .dot'));
  var fillEls = { i: $('fillI'), h: $('fillH'), e: $('fillE') };
  var beginBtn = $('beginBtn');
  var soundBtn = $('soundBtn');
  var soundLabel = $('soundLabel');
  var dimRange = $('dimRange');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  var PHASES = [
    { key: 'i', word: 'Inhale', hint: 'through the nose, softly', dur: 4, bell: 523.25 },
    { key: 'h', word: 'Hold',   hint: 'let the breath settle',    dur: 7, bell: 659.25 },
    { key: 'e', word: 'Exhale', hint: 'slow, through parted lips', dur: 8, bell: 392.00 }
  ];
  var SCALE_MIN = 0.62;
  var SCALE_MAX = 1.0;

  var running = false;
  var phaseIdx = 0;
  var phaseStart = 0;
  var heldBefore = 0;   /* ms frozen by holds already released */
  var holdAnchor = 0;   /* timestamp of current hold press */
  var holding = false;
  var shimmer = 0;
  var cycles = 0;
  var rafId = 0;
  var rippleTimers = [];

  /* ---------------- audio (all user-initiated) ---------------- */
  var ac = null;
  var master = null;
  var padGain = null;
  var padNodes = null;
  var shimmerGain = null;
  var shimmerSrc = null;
  var soundOn = false;

  function ensureAudio() {
    if (!ac) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return false; }
      ac = new Ctx();
      master = ac.createGain();
      master.gain.value = 0.9;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') { ac.resume(); }
    return true;
  }

  function playBell(freq, vol) {
    if (!soundOn || !ac) { return; }
    vol = vol || 0.16;
    var t = ac.currentTime;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    var f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 2400;
    var o1 = ac.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = freq;
    var o2 = ac.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = freq * 2.756;
    var g2 = ac.createGain();
    g2.gain.value = 0.22;
    o1.connect(f);
    o2.connect(g2);
    g2.connect(f);
    f.connect(g);
    g.connect(master);
    o1.start(t);
    o2.start(t);
    o1.stop(t + 2.7);
    o2.stop(t + 2.7);
  }

  function startPad() {
    if (!ensureAudio() || padNodes) { return; }
    var t = ac.currentTime;
    padGain = ac.createGain();
    padGain.gain.setValueAtTime(0.0001, t);
    padGain.gain.linearRampToValueAtTime(0.055, t + 3);
    var filt = ac.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 520;
    filt.Q.value = 0.4;
    var lfo = ac.createOscillator();
    lfo.frequency.value = 0.06;
    var lfoGain = ac.createGain();
    lfoGain.gain.value = 240;
    lfo.connect(lfoGain);
    lfoGain.connect(filt.frequency);
    var freqs = [110, 164.81, 220, 277.18];
    var oscs = freqs.map(function (f, i) {
      var o = ac.createOscillator();
      o.type = (i === 3) ? 'triangle' : 'sine';
      o.frequency.value = f;
      o.detune.value = (i % 2 === 0) ? -3 : 4;
      var g = ac.createGain();
      g.gain.value = (i === 0) ? 0.5 : 0.28;
      o.connect(g);
      g.connect(filt);
      o.start();
      return o;
    });
    filt.connect(padGain);
    padGain.connect(master);
    lfo.start();
    padNodes = { oscs: oscs, lfo: lfo };
  }

  function stopPad() {
    if (!padNodes || !ac) { return; }
    var t = ac.currentTime;
    padGain.gain.cancelScheduledValues(t);
    padGain.gain.setValueAtTime(Math.max(padGain.gain.value, 0.0001), t);
    padGain.gain.linearRampToValueAtTime(0.0001, t + 1.2);
    var nodes = padNodes;
    padNodes = null;
    window.setTimeout(function () {
      nodes.oscs.forEach(function (o) { try { o.stop(); } catch (e) {} });
      try { nodes.lfo.stop(); } catch (e) {}
    }, 1400);
  }

  function ensureShimmerVoice() {
    if (!soundOn || !ac || shimmerSrc) { return; }
    var len = Math.floor(ac.sampleRate * 2);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) { d[i] = Math.random() * 2 - 1; }
    shimmerSrc = ac.createBufferSource();
    shimmerSrc.buffer = buf;
    shimmerSrc.loop = true;
    var bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2400;
    bp.Q.value = 1.1;
    shimmerGain = ac.createGain();
    shimmerGain.gain.value = 0;
    shimmerSrc.connect(bp);
    bp.connect(shimmerGain);
    shimmerGain.connect(master);
    shimmerSrc.start();
  }

  /* ---------------- phase machine ---------------- */
  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function wordSet(i) {
    wordEl.style.opacity = 0;
    window.setTimeout(function () {
      wordEl.textContent = PHASES[i].word;
      hintEl.textContent = PHASES[i].hint;
      wordEl.style.opacity = 1;
    }, reduced.matches ? 60 : 220);
  }

  function spawnRipples(fromScale) {
    if (reduced.matches) { return; }
    for (var k = 0; k < 3; k++) {
      (function (k) {
        var timer = window.setTimeout(function () {
          var ring = document.createElement('i');
          ring.className = 'ripple';
          ring.style.setProperty('--from', String(fromScale));
          ring.style.animationDelay = (k * 0.28) + 's';
          ripplesEl.appendChild(ring);
          window.setTimeout(function () {
            if (ring.parentNode) { ring.parentNode.removeChild(ring); }
          }, 4200);
        }, k * 280);
        rippleTimers.push(timer);
      })(k);
    }
  }

  function updateDots() {
    var idx = (cycles - 1) % 4;
    dots.forEach(function (d, i) {
      d.classList.toggle('on', i <= idx && cycles > 0);
    });
    if (cycles > 0 && idx === 3) {
      window.setTimeout(function () {
        dots.forEach(function (d) { d.classList.remove('on'); });
      }, 1200);
    }
  }

  function loop(now) {
    if (!running) { return; }

    /* hold freeze bookkeeping */
    var holdMs = heldBefore + (holding ? (now - holdAnchor) : 0);
    var ph = PHASES[phaseIdx];
    var durMs = ph.dur * 1000;
    var elapsed = now - phaseStart - holdMs;

    if (elapsed >= durMs) {
      phaseIdx = (phaseIdx + 1) % PHASES.length;
      if (phaseIdx === 0) {
        cycles++;
        cycleEl.textContent = String(cycles + 1).padStart(2, '0');
        updateDots();
      }
      phaseStart = now;
      heldBefore = 0;
      if (holding) { holdAnchor = now; }
      elapsed = 0;
      wordSet(phaseIdx);
      spawnRipples(phaseIdx === 0 ? 0.66 : 1.0);
      playBell(PHASES[phaseIdx].bell);
      ph = PHASES[phaseIdx];
      durMs = ph.dur * 1000;
    }

    var t = Math.min(1, Math.max(0, elapsed / durMs));
    var scale;
    if (ph.key === 'i') {
      scale = SCALE_MIN + (SCALE_MAX - SCALE_MIN) * easeInOut(t);
      fillEls.i.style.width = (t * 100) + '%';
      fillEls.h.style.width = '0%';
      fillEls.e.style.width = '0%';
    } else if (ph.key === 'h') {
      scale = SCALE_MAX + 0.008 * Math.sin(now / 900);
      fillEls.i.style.width = '100%';
      fillEls.h.style.width = (t * 100) + '%';
      fillEls.e.style.width = '0%';
    } else {
      scale = SCALE_MAX - (SCALE_MAX - SCALE_MIN) * easeInOut(t);
      fillEls.i.style.width = '100%';
      fillEls.h.style.width = '100%';
      fillEls.e.style.width = (t * 100) + '%';
    }

    if (reduced.matches) {
      /* calm fallback: opacity breath, no scale, no ripples */
      var op = 0.62 + 0.38 * (ph.key === 'h' ? 1 : (ph.key === 'i' ? t : 1 - t));
      orb.style.opacity = op.toFixed(3);
    } else {
      orb.style.setProperty('--scale', scale.toFixed(4));
    }
    orbCount.textContent = String(Math.max(1, Math.ceil(durMs - elapsed) / 1000 | 0));

    /* shimmer */
    var target = 0;
    if (holding) {
      target = Math.min(1, 0.2 + (now - holdAnchor) / 2600);
    }
    shimmer += (target - shimmer) * 0.08;
    if (!reduced.matches) {
      theatre.style.setProperty('--shimmer', shimmer.toFixed(3));
    }
    if (shimmerGain && ac) {
      shimmerGain.gain.setTargetAtTime(shimmer * 0.05, ac.currentTime, 0.12);
    }

    rafId = requestAnimationFrame(loop);
  }

  function startSession() {
    if (running) { return; }
    running = true;
    document.body.classList.add('running');
    beginBtn.textContent = 'Pause';
    phaseIdx = 0;
    cycles = 0;
    heldBefore = 0;
    holding = false;
    shimmer = 0;
    phaseStart = performance.now();
    wordSet(0);
    spawnRipples(0.66);
    playBell(PHASES[0].bell);
    cycleEl.textContent = '01';
    rafId = requestAnimationFrame(loop);
  }

  function pauseSession() {
    running = false;
    document.body.classList.remove('running');
    beginBtn.textContent = 'Resume';
    cancelAnimationFrame(rafId);
    if (shimmerGain && ac) {
      shimmerGain.gain.setTargetAtTime(0, ac.currentTime, 0.2);
    }
    theatre.style.setProperty('--shimmer', '0');
  }

  /* ---------------- hold interaction ---------------- */
  function pressHold() {
    if (!running || holding) { return; }
    holding = true;
    holdAnchor = performance.now();
    theatre.classList.add('holding');
    ensureShimmerVoice();
  }
  function releaseHold() {
    if (!holding) { return; }
    heldBefore += performance.now() - holdAnchor;
    holding = false;
    theatre.classList.remove('holding');
  }

  orb.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (orb.setPointerCapture) { try { orb.setPointerCapture(e.pointerId); } catch (err) {} }
    pressHold();
  });
  orb.addEventListener('pointerup', releaseHold);
  orb.addEventListener('pointercancel', releaseHold);
  orb.addEventListener('lostpointercapture', releaseHold);
  orb.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault();
      pressHold();
    }
  });
  orb.addEventListener('keyup', function (e) {
    if (e.code === 'Space') { releaseHold(); }
  });
  orb.addEventListener('blur', releaseHold);
  orb.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------------- controls ---------------- */
  beginBtn.addEventListener('click', function () {
    if (running) { pauseSession(); } else { startSession(); }
  });

  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
    if (soundOn) {
      if (ensureAudio()) {
        startPad();
        playBell(659.25, 0.08);
      } else {
        soundOn = false;
        soundBtn.setAttribute('aria-pressed', 'false');
        soundLabel.textContent = 'Sound off';
      }
    } else {
      stopPad();
      if (shimmerGain && ac) {
        shimmerGain.gain.setTargetAtTime(0, ac.currentTime, 0.1);
      }
    }
  });

  dimRange.addEventListener('input', function () {
    document.documentElement.style.setProperty('--dim', String(dimRange.value / 100));
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      if (running) { pauseSession(); } else { startSession(); }
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && running) { pauseSession(); }
  });

  window.addEventListener('pagehide', function () {
    cancelAnimationFrame(rafId);
    rippleTimers.forEach(function (t) { window.clearTimeout(t); });
    if (ac) { try { ac.close(); } catch (e) {} }
  });

  /* init */
  fillEls.i.style.width = '0%';
  fillEls.h.style.width = '0%';
  fillEls.e.style.width = '0%';
  theatre.style.setProperty('--shimmer', '0');
})();
</script>
</body>
</html>
