<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERMINAL/84 — Phosphor Workstation</title>
<meta name="description" content="A full-screen CRT terminal: phosphor-green text on curved glass with scanlines and flicker, a typed boot sequence, a working command prompt with autocomplete, an ASCII gallery, a matrix mode, and an amber phosphor theme.">
<style>
/* ============================================================
   TERMINAL/84 — 010
   Warm glass, cold logic. Type something.
   ============================================================ */

:root {
  --screen: #050a06;
  --phos: #33ff66;
  --phos-soft: rgba(51, 255, 102, 0.66);
  --phos-dim: #1f7a3a;
  --phos-faint: rgba(31, 122, 58, 0.5);
  --amber: #ffb000;
  --amber-soft: rgba(255, 176, 0, 0.66);
  --amber-dim: #8a5a00;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, "Courier New", monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
  background: #010301;
}

body {
  font-family: var(--font-mono);
  color: var(--phos);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--phos);
  color: #02120a;
}

:focus-visible {
  outline: 1px solid var(--phos);
  outline-offset: 2px;
}

/* theme switch */
body.amber {
  --screen: #0b0600;
  --phos: var(--amber);
  --phos-soft: var(--amber-soft);
  --phos-dim: var(--amber-dim);
  --phos-faint: rgba(138, 90, 0, 0.5);
}

body.amber ::selection {
  background: var(--amber);
  color: #140a00;
}

/* ------------------------------------------------------------
   THE BEZEL + GLASS
   ------------------------------------------------------------ */

.bezel {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: stretch;
  padding: clamp(8px, 2vw, 26px);
  background:
    radial-gradient(120% 120% at 50% 40%, #1a1d18 0%, #0a0c09 55%, #030402 100%);
}

.crt {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: clamp(10px, 2.4vw, 26px);
  background: var(--screen);
  box-shadow:
    inset 0 0 clamp(40px, 9vw, 120px) rgba(0, 0, 0, 0.85),
    inset 0 0 6px 2px rgba(120, 255, 170, 0.06),
    0 0 0 3px #0c0e0a,
    0 0 0 6px #14170f,
    0 0 60px rgba(0, 0, 0, 0.9),
    0 0 90px rgba(51, 255, 102, 0.05);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

body.amber .crt {
  box-shadow:
    inset 0 0 clamp(40px, 9vw, 120px) rgba(0, 0, 0, 0.85),
    inset 0 0 6px 2px rgba(255, 176, 0, 0.05),
    0 0 0 3px #0e0b06,
    0 0 0 6px #17120a,
    0 0 60px rgba(0, 0, 0, 0.9),
    0 0 90px rgba(255, 176, 0, 0.04);
}

/* curved-screen vignette */
.crt::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  border-radius: inherit;
  background:
    radial-gradient(130% 118% at 50% 50%, transparent 62%, rgba(0, 0, 0, 0.55) 92%),
    linear-gradient(180deg, rgba(0,0,0,0.18), transparent 8% 92%, rgba(0,0,0,0.25));
}

/* scanlines + aperture grille */
.crt::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 41;
  pointer-events: none;
  background:
    repeating-linear-gradient(180deg,
      rgba(0, 0, 0, 0.22) 0 1px,
      transparent 1px 3px),
    repeating-linear-gradient(90deg,
      rgba(255, 255, 255, 0.012) 0 1px,
      transparent 1px 3px);
  mix-blend-mode: multiply;
}

/* flicker + roll bar */
.flicker {
  position: absolute;
  inset: 0;
  z-index: 42;
  pointer-events: none;
  background: rgba(51, 255, 102, 0.015);
  animation: flick 4.2s steps(3) infinite;
}

body.amber .flicker {
  background: rgba(255, 176, 0, 0.012);
}

@keyframes flick {
  0%, 100% { opacity: 0.6; }
  33% { opacity: 1; }
  66% { opacity: 0.4; }
}

.rollbar {
  position: absolute;
  left: 0;
  right: 0;
  top: -30%;
  height: 22%;
  z-index: 43;
  pointer-events: none;
  background: linear-gradient(180deg,
    transparent,
    rgba(51, 255, 102, 0.045) 45%,
    rgba(255, 255, 255, 0.02) 55%,
    transparent);
  animation: roll 9s linear infinite;
}

body.amber .rollbar {
  background: linear-gradient(180deg,
    transparent,
    rgba(255, 176, 0, 0.04) 45%,
    rgba(255, 255, 255, 0.018) 55%,
    transparent);
}

@keyframes roll {
  from { transform: translateY(-30%); }
  to   { transform: translateY(560%); }
}

/* ------------------------------------------------------------
   TEXT SURFACE
   ------------------------------------------------------------ */

.surface {
  position: relative;
  z-index: 10;
  flex: 1;
  min-height: 0;
  padding: clamp(12px, 2.6vw, 30px);
  overflow-y: auto;
  overflow-x: hidden;
  font-size: clamp(12px, 1.55vw, 16.5px);
  line-height: 1.42;
  text-shadow:
    0 0 5px rgba(51, 255, 102, 0.55),
    0 0 18px rgba(51, 255, 102, 0.2);
  cursor: text;
}

body.amber .surface {
  text-shadow:
    0 0 5px rgba(255, 176, 0, 0.5),
    0 0 18px rgba(255, 176, 0, 0.18);
}

.surface::-webkit-scrollbar {
  width: 8px;
}

.surface::-webkit-scrollbar-track {
  background: transparent;
}

.surface::-webkit-scrollbar-thumb {
  background: var(--phos-dim);
  border-radius: 4px;
}

.dim   { color: var(--phos-dim); }
.soft  { color: var(--phos-soft); }
.hi    { color: #d8ffe4; text-shadow: 0 0 6px rgba(51,255,102,0.8); }
body.amber .hi { color: #ffe9c4; text-shadow: 0 0 6px rgba(255,176,0,0.8); }
.err   { color: #ff7a6a; text-shadow: 0 0 6px rgba(255, 90, 70, 0.5); }
.inv   { background: var(--phos); color: var(--screen); text-shadow: none; padding: 0 4px; }
body.amber .inv { background: var(--amber); color: var(--screen); }

pre {
  font: inherit;
  line-height: 1.18;
  margin: 0;
}

.line {
  min-height: 1.42em;
  white-space: pre-wrap;
  word-break: break-word;
}

/* typing caret */
.caret {
  display: inline-block;
  width: 0.62em;
  height: 1.05em;
  margin-left: 1px;
  vertical-align: text-bottom;
  background: var(--phos);
  box-shadow: 0 0 8px rgba(51, 255, 102, 0.8);
  animation: blink 1.06s steps(1) infinite;
}

body.amber .caret {
  box-shadow: 0 0 8px rgba(255, 176, 0, 0.8);
}

@keyframes blink {
  0%, 55% { opacity: 1; }
  56%, 100% { opacity: 0; }
}

/* hidden input shim for mobile keyboards */
.input-shim {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  border: none;
  padding: 0;
  left: -9999px;
}

/* ------------------------------------------------------------
   POWER STRIP
   ------------------------------------------------------------ */

.power {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px clamp(12px, 2.6vw, 30px) 10px;
  border-top: 1px solid var(--phos-faint);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--phos-dim);
  user-select: none;
}

.power .lamp {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--phos);
  box-shadow: 0 0 8px var(--phos);
  animation: lamp 2.4s ease-in-out infinite;
}

@keyframes lamp {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.power .grow {
  flex: 1;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pbtn {
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: var(--phos-soft);
  border: 1px solid var(--phos-dim);
  background: transparent;
  padding: 6px 12px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  min-height: 32px;
}

.pbtn:hover,
.pbtn:focus-visible {
  background: rgba(51, 255, 102, 0.1);
  color: var(--phos);
}

body.amber .pbtn:hover,
body.amber .pbtn:focus-visible {
  background: rgba(255, 176, 0, 0.08);
}

.pbtn.on {
  background: var(--phos);
  color: var(--screen);
  text-shadow: none;
}

body.amber .pbtn.on {
  background: var(--amber);
}

@media (max-width: 620px) {
  .power .grow {
    display: none;
  }
}

/* ------------------------------------------------------------
   REDUCED MOTION — steady phosphor
   ------------------------------------------------------------ */

@media (prefers-reduced-motion: reduce) {
  .flicker,
  .rollbar,
  .caret,
  .power .lamp {
    animation: none;
  }
  .caret {
    opacity: 1;
  }
}
</style>
</head>
<body>

<div class="bezel">
  <div class="crt">

    <div class="surface" id="surface" aria-label="Terminal output, keyboard input ready"></div>
    <input class="input-shim" id="shim" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" aria-label="Terminal input">

    <div class="power">
      <span class="lamp" aria-hidden="true"></span>
      <span>Terminal/84</span>
      <span class="grow" id="statusLine">phosphor p1 · 80×24 · ready</span>
      <button class="pbtn" id="humBtn" type="button" aria-pressed="false">Hum: off</button>
      <button class="pbtn" id="themeBtn" type="button" aria-pressed="false">Amber</button>
    </div>

    <div class="flicker" aria-hidden="true"></div>
    <div class="rollbar" aria-hidden="true"></div>

  </div>
</div>

<script>
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ============================================================
     SURFACE + LINE PRIMITIVES
     ============================================================ */
  var surface = document.getElementById("surface");
  var statusLine = document.getElementById("statusLine");
  var MAX_LINES = 220;

  function makeLine(cls) {
    var div = document.createElement("div");
    div.className = "line" + (cls ? " " + cls : "");
    surface.appendChild(div);
    while (surface.children.length > MAX_LINES) {
      surface.removeChild(surface.firstChild);
    }
    return div;
  }

  function scrollBottom() {
    surface.scrollTop = surface.scrollHeight;
  }

  function textLine(txt, cls) {
    var el = makeLine(cls);
    el.textContent = txt === "" ? " " : txt;
    scrollBottom();
    return el;
  }

  /* typed output: per-character animation */
  var typeQueue = [];
  var typing = false;

  function enqueueTyped(txt, cls, cps, cb) {
    typeQueue.push({ txt: txt, cls: cls || "", cps: cps || 400, cb: cb || null });
    if (!typing) runTypeQueue();
  }

  function runTypeQueue() {
    var job = typeQueue.shift();
    if (!job) { typing = false; return; }
    typing = true;
    var el = makeLine(job.cls);
    var i = 0;
    var step = 1000 / job.cps;
    var last = performance.now();
    var acc = 0;
    function tickType(now) {
      if (!document.hidden) {
        acc += now - last;
      }
      last = now;
      while (acc >= step && i < job.txt.length) {
        acc -= step;
        i++;
      }
      el.textContent = job.txt.slice(0, i) || " ";
      scrollBottom();
      if (i < job.txt.length) {
        requestAnimationFrame(tickType);
      } else {
        if (job.cb) job.cb();
        runTypeQueue();
      }
    }
    if (reduced) {
      el.textContent = job.txt || " ";
      scrollBottom();
      if (job.cb) job.cb();
      runTypeQueue();
    } else {
      requestAnimationFrame(tickType);
    }
  }

  /* ============================================================
     BOOT SEQUENCE
     ============================================================ */
  var BOOT = [
    { txt: "TERMINAL/84  ROM MONITOR  V2.3", cls: "hi", cps: 700 },
    { txt: "(C) 1984 PHOSPHOR WORKSTATIONS LTD.", cls: "dim", cps: 700 },
    { txt: "", cps: 400 },
    { txt: "MEMORY TEST ......... 64K OK", cps: 480 },
    { txt: "VIDEO ............... P1 PHOSPHOR, 80x24", cps: 480 },
    { txt: "KEYBOARD ............ 84-KEY, BUCKLING SPRING", cps: 480 },
    { txt: "SERIAL .............. /DEV/TTY0 @ 9600 8N1", cps: 480 },
    { txt: "TAPE DRIVE .......... EMPTY", cls: "dim", cps: 480 },
    { txt: "", cps: 400 },
    { txt: "LOADING FONT BITMAPS ............ DONE", cps: 520 },
    { txt: "MOUNTING /GALLERY ............... DONE", cps: 520 },
    { txt: "CHECKING PHOSPHOR DECAY ......... NOMINAL", cps: 520 },
    { txt: "", cps: 300 },
    { txt: "WELCOME, OPERATOR. THE MACHINE IS YOURS.", cls: "hi", cps: 380 },
    { txt: "TYPE 'HELP' FOR THE COMMAND INDEX.", cls: "soft", cps: 380 }
  ];

  var booted = false;

  function runBoot() {
    statusLine.textContent = "phosphor p1 · 80×24 · booting";
    BOOT.forEach(function (j) { enqueueTyped(j.txt, j.cls, j.cps); });
    enqueueTyped("", "", 400, function () {
      booted = true;
      promptLine();
      statusLine.textContent = "phosphor p1 · 80×24 · ready";
    });
  }

  /* ============================================================
     PROMPT + INPUT
     ============================================================ */
  var PROMPT = "operator@t84:~$ ";
  var promptEl = null;      /* the live prompt line */
  var inputBuf = "";
  var history = [];
  var histIdx = -1;

  function promptLine() {
    promptEl = makeLine();
    renderPrompt();
    scrollBottom();
  }

  function renderPrompt() {
    if (!promptEl) return;
    var caret = document.createElement("span");
    caret.className = "caret";
    promptEl.textContent = PROMPT + inputBuf;
    promptEl.appendChild(caret);
    scrollBottom();
  }

  function commitPrompt(cmd) {
    /* history echo without caret */
    if (promptEl) {
      promptEl.textContent = PROMPT + cmd;
      promptEl.classList.add("soft");
      promptEl = null;
    }
  }

  var shim = document.getElementById("shim");

  function focusInput() {
    if (window.matchMedia("(hover: none)").matches || "ontouchstart" in window) {
      shim.focus({ preventScroll: true });
    }
  }

  surface.addEventListener("pointerdown", function () {
    focusInput();
  });

  window.addEventListener("keydown", function (e) {
    /* ignore when a power button has focus and the key is space/enter */
    var active = document.activeElement;
    var onBtn = active && active.classList && active.classList.contains("pbtn");
    if (onBtn && (e.key === " " || e.key === "Enter")) return;

    if (!booted) {
      /* allow skipping boot */
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        skipBoot();
      }
      return;
    }

    if (e.metaKey || e.ctrlKey || e.altKey) {
      if (e.ctrlKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); cmdClear(); }
      if (e.ctrlKey && (e.key === "c" || e.key === "C")) { e.preventDefault(); ctrlC(); }
      return;
    }

    if (e.key === "Enter") {
      e.preventDefault();
      var cmd = inputBuf;
      inputBuf = "";
      commitPrompt(cmd);
      if (cmd.trim() !== "") {
        history.push(cmd);
        if (history.length > 60) history.shift();
      }
      histIdx = -1;
      execute(cmd);
    } else if (e.key === "Backspace") {
      e.preventDefault();
      if (inputBuf.length) {
        inputBuf = inputBuf.slice(0, -1);
        renderPrompt();
      }
    } else if (e.key === "Tab") {
      e.preventDefault();
      autocomplete();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (!history.length) return;
      if (histIdx === -1) histIdx = history.length;
      histIdx = Math.max(0, histIdx - 1);
      inputBuf = history[histIdx];
      renderPrompt();
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (histIdx === -1) return;
      histIdx = Math.min(history.length, histIdx + 1);
      inputBuf = histIdx === history.length ? "" : history[histIdx];
      renderPrompt();
    } else if (e.key.length === 1) {
      e.preventDefault();
      if (inputBuf.length < 80) {
        inputBuf += e.key;
        renderPrompt();
      }
    }
    focusInput();
  });

  /* mobile shim */
  shim.addEventListener("input", function () {
    if (!booted) return;
    var v = shim.value;
    if (v.endsWith("\n")) {
      var cmd = inputBuf;
      shim.value = "";
      commitPrompt(cmd);
      if (cmd.trim() !== "") { history.push(cmd); if (history.length > 60) history.shift(); }
      histIdx = -1;
      execute(cmd);
      return;
    }
    inputBuf = v;
    renderPrompt();
  });
  shim.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var cmd = shim.value;
      shim.value = "";
      inputBuf = "";
      commitPrompt(cmd);
      if (cmd.trim() !== "") { history.push(cmd); if (history.length > 60) history.shift(); }
      histIdx = -1;
      execute(cmd);
    }
  });

  function ctrlC() {
    if (promptEl) {
      promptEl.textContent = PROMPT + inputBuf + "^C";
      promptEl.classList.add("dim");
      promptEl = null;
    }
    inputBuf = "";
    promptLine();
    textLine("interrupt", "dim");
  }

  /* ============================================================
     TAB AUTOCOMPLETE
     ============================================================ */
  var COMMANDS = ["help", "about", "gallery", "matrix", "theme", "clear",
                  "status", "listen", "konami", "whoami", "date", "echo"];

  function autocomplete() {
    var parts = inputBuf.split(/\s+/);
    var frag = parts[parts.length - 1].toLowerCase();
    if (!frag) { return; }
    var hits = COMMANDS.filter(function (c) { return c.indexOf(frag) === 0; });
    if (hits.length === 1) {
      parts[parts.length - 1] = hits[0];
      inputBuf = parts.join(" ");
      renderPrompt();
    } else if (hits.length > 1) {
      var echo = makeLine("dim");
      echo.textContent = PROMPT + inputBuf;
      textLine(hits.join("   "), "soft");
      /* longest common prefix */
      var pre = hits[0];
      for (var i = 1; i < hits.length; i++) {
        while (hits[i].indexOf(pre) !== 0) pre = pre.slice(0, -1);
      }
      if (pre.length > frag.length) {
        parts[parts.length - 1] = pre;
        inputBuf = parts.join(" ");
      }
      promptLine();
    }
  }

  /* ============================================================
     COMMANDS
     ============================================================ */
  var matrixOn = false;
  var matrixRaf = 0;
  var humOn = false;
  var audio = null;
  var humNodes = null;

  function execute(raw) {
    var cmd = raw.trim();
    if (cmd === "") { promptLine(); return; }
    var parts = cmd.split(/\s+/);
    var name = parts[0].toLowerCase();
    var rest = parts.slice(1).join(" ");

    switch (name) {
      case "help": cmdHelp(); break;
      case "about": cmdAbout(); break;
      case "gallery": cmdGallery(); break;
      case "matrix": cmdMatrix(); break;
      case "theme": cmdTheme(rest); break;
      case "clear": cmdClear(); break;
      case "status": cmdStatus(); break;
      case "listen": cmdListen(); break;
      case "whoami": cmdWhoami(); break;
      case "date": cmdDate(); break;
      case "echo": textLine(rest || "", "soft"); promptLine(); break;
      case "konami": cmdKonami(); break;
      case "sudo":
        textLine("operator is not in the sudoers file.", "err");
        textLine("this incident will be reported to the curator.", "dim");
        promptLine();
        break;
      default:
        textLine("t84: command not found: " + name, "err");
        textLine("try 'help' — the machine is patient.", "dim");
        promptLine();
    }
  }

  function cmdHelp() {
    textLine("COMMAND INDEX", "hi");
    var rows = [
      ["help", "this index"],
      ["about", "what this machine is"],
      ["gallery", "ascii tour of the 100-room gallery"],
      ["matrix", "digital rain over the screen (toggle)"],
      ["theme", "phosphor | amber"],
      ["listen", "toggle the 60hz mains hum"],
      ["status", "diagnostics"],
      ["clear", "wipe the screen (ctrl+L)"],
      ["whoami", "identify the operator"],
      ["date", "machine time"],
      ["echo", "repeat after you"],
      ["sudo", "try it"]
    ];
    rows.forEach(function (r) {
      var el = makeLine();
      var pad = " ".repeat(Math.max(1, 12 - r[0].length));
      el.textContent = "  " + r[0] + pad + "— " + r[1];
    });
    textLine("TAB completes. ↑/↓ walks history. type 'konami' if you know.", "dim");
    promptLine();
  }

  function cmdAbout() {
    textLine("TERMINAL/84 — 'the patient machine'", "hi");
    [
      "a single-file cathode workstation. no network, no disk,",
      "no memory beyond this scrollback. it was built to sit in",
      "room 10 of a 100-room gallery and wait for someone who",
      "still types by hand.",
      "",
      "the tube is glass and arithmetic. the phosphor is css.",
      "the hum, when you ask for it, is an oscillator. everything",
      "else is you."
    ].forEach(function (t) { textLine(t, "soft"); });
    promptLine();
  }

  function cmdGallery() {
    textLine("THE GALLERY OF 100 — ROOM INDEX (EXCERPT)", "hi");
    textLine("");
    [
      "01  aurora-glass .............. glass rooms over a living sky",
      "02  neon-district-2099 ........ the city sells you signal",
      "03  concrete-poetry ........... yellow, louder than reason",
      "04  liquid-chrome ............. slow metal in residence",
      "05  ink-mountain .............. carbon, water, patience",
      "06  clockwork-orrery .......... four centuries under one thumb",
      "07  starlight-loom ............ the cursor is a needle",
      "08  maison-edition-04 ......... photographs made of light",
      "09  bauhaus-bounce ............ form follows fun",
      "10  terminal-84 ............... you are here"
    ].forEach(function (t) { textLine(t, ""); });
    textLine("");
    textLine("90 further rooms remain dark on this terminal's map.", "dim");
    textLine("the curators are still hanging them.", "dim");
    promptLine();
  }

  function cmdStatus() {
    textLine("DIAGNOSTICS", "hi");
    var rows = [
      ["tube", document.body.classList.contains("amber") ? "amber p3" : "green p1"],
      ["lines in scrollback", String(surface.children.length)],
      ["commands remembered", String(history.length)],
      ["matrix rain", matrixOn ? "RUNNING" : "dormant"],
      ["mains hum", humOn ? "energized" : "silent"],
      ["operator", "present, presumably human"]
    ];
    rows.forEach(function (r) {
      var el = makeLine();
      el.textContent = "  " + r[0] + " ".repeat(Math.max(2, 24 - r[0].length)) + ": " + r[1];
    });
    promptLine();
  }

  function cmdTheme(arg) {
    var a = (arg || "").toLowerCase();
    if (a === "amber") { setTheme(true); }
    else if (a === "phosphor" || a === "green") { setTheme(false); }
    else {
      textLine("usage: theme phosphor|amber", "dim");
    }
    promptLine();
  }

  function setTheme(amber) {
    document.body.classList.toggle("amber", amber);
    themeBtn.textContent = amber ? "Phosphor" : "Amber";
    themeBtn.setAttribute("aria-pressed", amber ? "true" : "false");
    statusLine.textContent = (amber ? "amber p3" : "phosphor p1") + " · 80×24 · ready";
    textLine(amber
      ? "phosphor swapped: warm amber p3. mind your eyes."
      : "phosphor swapped: classic green p1.", "soft");
  }

  function cmdClear() {
    surface.textContent = "";
    promptEl = null;
    textLine("(screen wiped — the phosphor remembers nothing)", "dim");
    promptLine();
  }

  function cmdWhoami() {
    textLine("operator", "hi");
    textLine("the terminal cannot verify more than that.", "dim");
    promptLine();
  }

  function cmdDate() {
    textLine(new Date().toString(), "soft");
    promptLine();
  }

  function cmdListen() {
    toggleHum();
    promptLine();
  }

  function cmdKonami() {
    textLine("↑ ↑ ↓ ↓ ← → ← → B A — accepted.", "hi");
    textLine("");
    [
      "   ___  ____  ____  __  __ ___    ___  ____  ____   ",
      "  / _ \\|  _ \\|  _ \\|  \\/  | _ \\  / _ \\|  _ \\|  _ \\  ",
      " | | | | |_) | |_) | |\\/| |   / | | | | |_) | |_) | ",
      " | |_| |  _ <|  _ <| |  | | |\\ \\ | |_| |  _ <|  _ <  ",
      "  \\___/|_| \\_\\_| \\_\\_|  |_|_| \\_\\ \\___/|_| \\_\\_| \\_\\ ",
      ""
    ].forEach(function (t) { textLine(t, "soft"); });
    textLine("achievement unlocked: PHOSPHOR WHISPERER.", "hi");
    textLine("the machine tips its glass to you, operator.", "dim");
    promptLine();
  }

  /* ============================================================
     MATRIX RAIN — canvas overlay on the tube
     ============================================================ */
  var rainCv = document.createElement("canvas");
  rainCv.style.cssText = "position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none;";
  var rainCtx = rainCv.getContext("2d");
  var rainCols = [];
  var rainW = 0, rainH = 0, rainCell = 16;

  function sizeRain() {
    var rect = rainCv.getBoundingClientRect();
    rainW = Math.max(1, rect.width);
    rainH = Math.max(1, rect.height);
    rainCv.width = Math.round(rainW);
    rainCv.height = Math.round(rainH);
    var n = Math.ceil(rainW / rainCell);
    rainCols = [];
    for (var i = 0; i < n; i++) {
      rainCols.push({ y: Math.random() * rainH, sp: 120 + Math.random() * 260 });
    }
  }

  var GLYPHS = "ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃ0123456789ABCDEF";

  function matrixStep(dt) {
    rainCtx.fillStyle = "rgba(5,10,6,0.28)";
    rainCtx.fillRect(0, 0, rainW, rainH);
    rainCtx.font = rainCell + "px ui-monospace, 'Courier New', monospace";
    var amber = document.body.classList.contains("amber");
    for (var i = 0; i < rainCols.length; i++) {
      var c = rainCols[i];
      c.y += c.sp * dt;
      if (c.y > rainH + 60) {
        c.y = -40 - Math.random() * 200;
        c.sp = 120 + Math.random() * 260;
      }
      var g = GLYPHS[(Math.random() * GLYPHS.length) | 0];
      var x = i * rainCell + 2;
      var yy = c.y;
      rainCtx.fillStyle = amber ? "rgba(255,220,150,0.85)" : "rgba(190,255,210,0.85)";
      rainCtx.fillText(g, x, yy);
      rainCtx.fillStyle = amber ? "rgba(255,176,0,0.5)" : "rgba(51,255,102,0.5)";
      rainCtx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, yy - rainCell);
      rainCtx.fillStyle = amber ? "rgba(138,90,0,0.3)" : "rgba(31,122,58,0.3)";
      rainCtx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, yy - rainCell * 2);
    }
  }

  function cmdMatrix() {
    matrixOn = !matrixOn;
    if (matrixOn) {
      surface.appendChild(rainCv);
      sizeRain();
      rainCtx.fillStyle = "rgba(5,10,6,1)";
      rainCtx.fillRect(0, 0, rainW, rainH);
      var r2 = 0;
      var last2 = performance.now();
      var loop = function (now) {
        if (!matrixOn) return;
        var dt = Math.min(0.05, (now - last2) / 1000);
        last2 = now;
        if (!document.hidden && !reduced) matrixStep(dt);
        matrixRaf = requestAnimationFrame(loop);
      };
      matrixRaf = requestAnimationFrame(loop);
      textLine("matrix: follow the white rabbit. (run again to stop)", "soft");
    } else {
      cancelAnimationFrame(matrixRaf);
      if (rainCv.parentNode) rainCv.parentNode.removeChild(rainCv);
      textLine("matrix: rain stopped. the desert clears.", "dim");
    }
    promptLine();
  }

  /* ============================================================
     MAINS HUM — user-initiated WebAudio
     ============================================================ */
  var humBtn = document.getElementById("humBtn");

  function toggleHum() {
    humOn = !humOn;
    if (humOn) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) {
        textLine("listen: no audio hardware found on this tube.", "err");
        humOn = false;
        promptLine();
        return;
      }
      if (!audio) audio = new AC();
      if (audio.state === "suspended") audio.resume();
      var o1 = audio.createOscillator();
      var o2 = audio.createOscillator();
      var gn = audio.createGain();
      o1.type = "sine";
      o1.frequency.value = 60;
      o2.type = "sine";
      o2.frequency.value = 120;
      gn.gain.value = 0;
      gn.gain.linearRampToValueAtTime(0.014, audio.currentTime + 1.2);
      o1.connect(gn);
      o2.connect(gn);
      gn.connect(audio.destination);
      o1.start();
      o2.start();
      humNodes = { o1: o1, o2: o2, gn: gn };
      humBtn.textContent = "Hum: on";
      humBtn.classList.add("on");
      humBtn.setAttribute("aria-pressed", "true");
      textLine("listen: 60hz mains hum energized. feel free to forget it.", "soft");
    } else {
      if (humNodes) {
        var n = humNodes;
        n.gn.gain.linearRampToValueAtTime(0, audio.currentTime + 0.5);
        setTimeout(function () {
          try { n.o1.stop(); n.o2.stop(); } catch (e2) {}
        }, 600);
        humNodes = null;
      }
      humBtn.textContent = "Hum: off";
      humBtn.classList.remove("on");
      humBtn.setAttribute("aria-pressed", "false");
      textLine("listen: hum discharged. the room is quieter than you thought.", "dim");
    }
  }

  humBtn.addEventListener("click", function () { toggleHum(); });

  /* ============================================================
     THEME BUTTON
     ============================================================ */
  var themeBtn = document.getElementById("themeBtn");
  themeBtn.addEventListener("click", function () {
    setTheme(!document.body.classList.contains("amber"));
  });

  /* ============================================================
     BOOT CONTROL
     ============================================================ */
  function skipBoot() {
    if (booted) return;
    typeQueue.length = 0;
    typing = false;
    /* flush all lines instantly */
    surface.textContent = "";
    BOOT.forEach(function (j) { textLine(j.txt, j.cls); });
    booted = true;
    promptLine();
    statusLine.textContent = "phosphor p1 · 80×24 · ready";
  }

  /* ============================================================
     IDLE TENDING — a slow status wink
     ============================================================ */
  var idleRaf = 0;
  var lastWink = performance.now();
  var WINKS = [
    "phosphor p1 · 80×24 · nominal",
    "phosphor p1 · 80×24 · tube warm",
    "phosphor p1 · 80×24 · awaiting input"
  ];
  var winkIdx = 0;
  function idleLoop(now) {
    if (now - lastWink > 9000 && booted && !matrixOn) {
      lastWink = now;
      winkIdx = (winkIdx + 1) % WINKS.length;
      statusLine.textContent = WINKS[winkIdx];
    }
    idleRaf = requestAnimationFrame(idleLoop);
  }
  if (!reduced) idleRaf = requestAnimationFrame(idleLoop);

  window.addEventListener("resize", function () {
    if (matrixOn) sizeRain();
  });

  window.addEventListener("pagehide", function () {
    if (matrixRaf) cancelAnimationFrame(matrixRaf);
    if (idleRaf) cancelAnimationFrame(idleRaf);
    if (humNodes) { try { humNodes.o1.stop(); humNodes.o2.stop(); } catch (e3) {} }
  });

  /* ============================================================
     IGNITION
     ============================================================ */
  textLine("(press ENTER to skip the boot ritual)", "dim");
  runBoot();
})();
</script>
</body>
</html>
