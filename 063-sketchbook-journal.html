<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Sketch — A Traveler&rsquo;s Notebook</title>
<style>
  :root{
    --paper:#f6f1e4;
    --paper-lo:#ece4cf;
    --pencil:#6b6862;
    --ink-soft:#4d4a44;
    --teal:#4e8a80;
    --ochre:#c98a2d;
    --tape:#d9c9a8;
    --desk-a:#26333a;
    --desk-b:#18232a;
    --serif:Georgia,"Times New Roman",ui-serif,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%,rgba(255,236,200,.14),#0000 55%),
      radial-gradient(140% 100% at 50% 120%,#000 40%,#0000 75%),
      linear-gradient(175deg,var(--desk-a),var(--desk-b));
    overflow:hidden;
    font-family:var(--serif);
    color:var(--ink-soft);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  ::selection{background:var(--ochre);color:#fff}

  .masthead{
    display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
    padding:clamp(10px,2.2vh,20px) clamp(16px,3vw,40px) 0;
    color:#e9e2cd;
  }
  .masthead .kick{
    font-family:var(--mono);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
    color:rgba(233,226,205,.55);
  }
  .masthead h1{
    font-size:clamp(1.3rem,3.2vw,2.2rem);font-weight:400;letter-spacing:.02em;
  }
  .masthead h1 em{font-style:italic;color:#d8b06a}
  .masthead .dots{margin-left:auto;display:flex;gap:8px;align-items:center}
  .dot{
    width:9px;height:9px;border-radius:50%;border:1px solid rgba(233,226,205,.5);
    transition:background .3s,transform .3s;
  }
  .dot[aria-current="true"]{background:#d8b06a;border-color:#d8b06a;transform:scale(1.25)}
  .masthead .hint{
    flex-basis:100%;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(233,226,205,.4);font-family:var(--mono);
  }

  /* ============ the book ============ */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:clamp(8px,2vh,24px)}
  .book{
    position:relative;
    width:min(1080px,94vw);
    aspect-ratio:2/1;
    max-height:100%;
    perspective:1900px;
  }
  .page{
    position:absolute;top:0;bottom:0;width:50%;
    background:
      radial-gradient(120% 100% at 20% 0%,rgba(255,255,255,.5),#0000 50%),
      repeating-linear-gradient(0deg,rgba(107,104,98,.045) 0 1px,#0000 1px 4px),
      linear-gradient(160deg,var(--paper),var(--paper-lo));
    box-shadow:
      inset 0 0 34px rgba(107,104,98,.16),
      0 18px 40px rgba(0,0,0,.5);
    overflow:hidden;
  }
  .page.left{left:0;border-radius:6px 2px 2px 6px;
    box-shadow:inset -14px 0 22px -12px rgba(70,60,40,.5),inset 0 0 34px rgba(107,104,98,.16),0 18px 40px rgba(0,0,0,.5)}
  .page.right{right:0;border-radius:2px 6px 6px 2px;
    box-shadow:inset 14px 0 22px -12px rgba(70,60,40,.45),inset 0 0 34px rgba(107,104,98,.16),0 18px 40px rgba(0,0,0,.5)}
  .book::after{ /* desk shadow seam */
    content:"";position:absolute;left:50%;top:2%;bottom:2%;width:26px;transform:translateX(-50%);
    background:linear-gradient(90deg,#0000,rgba(40,32,18,.18) 50%,#0000);
    pointer-events:none;border-radius:50%;
    filter:blur(2px);
  }

  .leaf{
    position:absolute;top:0;bottom:0;right:0;width:50%;
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform 1.15s cubic-bezier(.42,.05,.3,1);
    z-index:5;cursor:pointer;
  }
  .leaf.turning{transform:rotateY(-180deg);cursor:default}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
    background:
      radial-gradient(120% 100% at 20% 0%,rgba(255,255,255,.5),#0000 50%),
      repeating-linear-gradient(0deg,rgba(107,104,98,.045) 0 1px,#0000 1px 4px),
      linear-gradient(160deg,var(--paper),var(--paper-lo));
    box-shadow:inset 0 0 34px rgba(107,104,98,.16);
  }
  .face.front{border-radius:2px 6px 6px 2px}
  .face.back{transform:rotateY(180deg);border-radius:6px 2px 2px 6px}
  .leaf .sheen{
    position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
    background:linear-gradient(105deg,#0000 30%,rgba(255,255,240,.35) 48%,#0000 62%);
  }
  .leaf.turning .sheen{opacity:1}

  .corner{
    position:absolute;right:0;bottom:0;width:64px;height:64px;z-index:6;
    cursor:pointer;border:0;background:#0000;padding:0;
  }
  .corner svg{position:absolute;inset:0;width:100%;height:100%}
  .corner .curl{
    position:absolute;right:-34px;bottom:-34px;width:68px;height:68px;
    background:linear-gradient(315deg,var(--paper-lo) 46%,#d8cdb0 52%,rgba(120,108,82,.35) 60%,#0000 62%);
    border-radius:8px 0 0 0;
    transition:transform .35s cubic-bezier(.3,1.4,.5,1);
    box-shadow:-3px -3px 8px rgba(70,60,40,.25);
  }
  .corner:hover .curl,.corner:focus-visible .curl{transform:translate(-5px,-5px) rotate(-3deg)}
  .corner:focus-visible{outline:2px dashed var(--ochre);outline-offset:-6px;border-radius:12px}
  .corner .tip{
    position:absolute;right:6px;bottom:6px;
    font-family:var(--mono);font-size:8px;letter-spacing:.22em;color:rgba(77,74,68,.55);
    text-transform:uppercase;pointer-events:none;
  }

  /* ============ page furniture ============ */
  .pcontent{position:absolute;inset:0;padding:clamp(12px,3.2%,30px);display:flex;flex-direction:column}
  .phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2%}
  .phead .city{
    font-size:clamp(1rem,2.6vw,1.7rem);letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .stamp{
    font-family:var(--mono);font-size:clamp(7px,1vw,9px);letter-spacing:.24em;
    color:#a34d3f;border:1.5px solid rgba(163,77,63,.55);border-radius:4px;
    padding:4px 8px;transform:rotate(-4deg);text-transform:uppercase;
    mask-image:radial-gradient(circle at 30% 60%,#000 92%,#0000 100%);
    -webkit-mask-image:radial-gradient(circle at 30% 60%,#000 92%,#0000 100%);
    opacity:.85;
  }
  .rule{height:1px;background:linear-gradient(90deg,rgba(107,104,98,.5),#0000);margin:1.5% 0 2.5%}

  .sketchwrap{position:relative;flex:1;min-height:0}
  .sketch{width:100%;height:100%;display:block}
  .pencil-art{filter:grayscale(1) contrast(1.04);transition:filter .7s ease}
  .sketchwrap:hover .pencil-art,.sketchwrap:focus-within .pencil-art{filter:grayscale(0) contrast(1) saturate(1.15)}
  .wash{opacity:0;transition:opacity .8s ease}
  .sketchwrap:hover .wash,.sketchwrap:focus-within .wash{opacity:1}
  .sketchwrap{cursor:pointer}
  .sketchwrap:focus-visible{outline:2px dashed var(--ochre);outline-offset:4px;border-radius:8px}
  .reveal{
    position:absolute;left:8px;bottom:2px;font-family:var(--mono);font-size:8px;
    letter-spacing:.22em;text-transform:uppercase;color:rgba(77,74,68,.5);
    transition:color .5s;
  }
  .sketchwrap:hover .reveal{color:var(--ochre)}

  .notes{list-style:none;margin-top:2%;display:grid;gap:1.6%}
  .notes li{
    font-style:italic;font-size:clamp(11px,1.35vw,15px);line-height:1.45;color:#57544d;
    padding-left:1.2em;position:relative;transform:rotate(-.4deg);
  }
  .notes li::before{content:"—";position:absolute;left:0;color:var(--ochre)}
  .notes li b{font-style:normal;font-weight:600;color:var(--ink-soft)}
  .pagenum{
    position:absolute;bottom:2.5%;right:4%;
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:rgba(77,74,68,.55);
  }

  /* tape + photos */
  .photo{
    position:absolute;width:26%;aspect-ratio:4/3;
    background:linear-gradient(150deg,#c8bfa4,#b3a88b);
    box-shadow:0 6px 14px rgba(40,34,20,.4);
    transform:rotate(3deg);
    padding:5.5% 5.5% 16%;
  }
  .photo .art{width:100%;height:100%;overflow:hidden;position:relative}
  .photo figcaption{
    position:absolute;left:0;right:0;bottom:3.5%;text-align:center;
    font-family:var(--mono);font-size:7px;letter-spacing:.18em;color:rgba(60,52,36,.75);
    text-transform:uppercase;
  }
  .tape{
    position:absolute;width:34%;height:16px;background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 3px,#0000 3px 7px),
      linear-gradient(var(--tape),rgba(217,201,168,.75));
    box-shadow:0 1px 3px rgba(40,34,20,.3);
    opacity:.92;
  }
  .tape.tl{top:-8px;left:-10px;transform:rotate(-38deg)}
  .tape.tr{top:-8px;right:-10px;transform:rotate(36deg)}

  /* coffee ring */
  .coffee{
    position:absolute;width:110px;height:96px;border-radius:50%;
    border:7px solid rgba(122,84,44,.34);
    filter:blur(.6px);
    box-shadow:inset 0 0 10px rgba(122,84,44,.28),0 0 0 2px rgba(122,84,44,.1);
    transform:rotate(-8deg) scaleY(.92);
    pointer-events:none;
  }
  .coffee::after{
    content:"";position:absolute;inset:8px;border-radius:50%;
    border:2px solid rgba(122,84,44,.2);filter:blur(1px);
  }

  .polaroid-note{
    position:absolute;font-style:italic;font-size:clamp(10px,1.2vw,13px);color:#57544d;
    transform:rotate(2deg);
  }

  /* ============ templates hidden ============ */
  template{display:none}

  /* ============ responsive ============ */
  @media (max-width:660px){
    body{overflow:auto}
    .book{aspect-ratio:3/3.6;width:min(440px,94vw)}
    .page,.leaf{width:100%}
    .page.left{display:none}
    .page.right{border-radius:6px}
    .face.back{border-radius:6px}
    .book::after{display:none}
    .photo{width:44%}
  }
  @media (prefers-reduced-motion:reduce){
    .leaf{transition:none}
    .leaf.turning{transition:opacity .4s;transform:none;opacity:0}
    .corner:hover .curl,.corner:focus-visible .curl{transform:none}
    .pencil-art,.wash,.dot{transition:none}
  }
</style>
</head>
<body>

<header class="masthead">
  <span class="kick">Gallery of 100 &middot; Hall IV &middot; Traveler&rsquo;s Notebook</span>
  <h1>Field <em>Sketch</em></h1>
  <div class="dots" aria-hidden="true">
    <span class="dot" data-d="0" aria-current="true"></span>
    <span class="dot" data-d="1"></span>
  </div>
  <span class="hint">Hover a drawing to remember it in color &middot; turn the page at the corner</span>
</header>

<!-- shared paint + filter definitions -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"></feDisplacementMap>
    </filter>
    <filter id="wobble2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="19" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"></feDisplacementMap>
    </filter>
    <linearGradient id="sunwash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c98a"></stop>
      <stop offset="1" stop-color="#f6f1e4" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="tealwash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4e8a80" stop-opacity=".55"></stop>
      <stop offset="1" stop-color="#7fb3a5" stop-opacity=".25"></stop>
    </linearGradient>
    <linearGradient id="skyLx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c995" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#c98a2d" stop-opacity=".35"></stop>
    </linearGradient>
  </defs>
</svg>

<main class="stage">
  <div class="book" id="book" aria-label="Sketchbook spreads: Lisbon and Kyoto">
    <div class="page left" id="staticLeft"></div>
    <div class="page right" id="staticRight"></div>
    <div class="leaf" id="leaf">
      <div class="face front" id="leafFront"></div>
      <div class="face back" id="leafBack"></div>
      <div class="sheen" aria-hidden="true"></div>
    </div>
    <button class="corner" id="cornerBtn" type="button" aria-label="Turn the page">
      <span class="curl" aria-hidden="true"></span>
      <span class="tip">turn</span>
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M2 62 Q10 30 40 6" fill="none" stroke="rgba(77,74,68,.35)" stroke-width="1"></path></svg>
    </button>
  </div>
</main>

<!-- ===================== LISBON · LEFT ===================== -->

    <div class="rule"></div>
    <div class="sketchwrap" tabindex="0" role="img" aria-label="Pencil sketch of tram 28 climbing a tiled hillside street">
      <svg class="sketch" viewBox="0 0 460 300" preserveAspectRatio="xMidYMid meet">
        <g class="pencil-art" filter="url(#wobble)" stroke="#6b6862" fill="none" stroke-width="1.6" stroke-linecap="round">
          <path d="M18 268 L442 268" stroke-width="2.2"></path>
          <path d="M60 268 L60 214 L150 214 L150 268"></path>
          <path d="M150 214 L166 196 L256 196 L256 268"></path>
          <path d="M256 196 L272 180 L372 180 L372 268"></path>
          <path d="M372 180 L390 166 L438 166 L438 268"></path>

          <rect x="238" y="176" width="22" height="26" rx="3"></rect>
          <rect x="270" y="176" width="22" height="26" rx="3"></rect>
          <circle cx="216" cy="232" r="8"></circle>
          <circle cx="288" cy="232" r="8"></circle>

          <path d="M304 150 L304 128 L312 128 L312 150" stroke-width="1.4"></path>
        </g>
        <g class="wash">
          <rect x="0" y="0" width="460" height="120" fill="url(#sunwash)"></rect>
          <rect x="196" y="150" width="112" height="74" rx="9" fill="#f2b544" opacity=".5"></rect>

          <path d="M372 180 L372 268 L438 268 L438 166 Z" fill="#a34d3f" opacity=".22"></path>
        </g>
      </svg>
      <span class="reveal">pencil &rarr; memory</span>
    </div>
    <ul class="notes">
      <li>Tram 28 groans up <b>Calc&ccedil;ada da Estrela</b> like it resents the hill.</li>
      <li>Azulejos the colour of pool water, half of them cracked, all of them singing.</li>
      <li>Coffee n&deg;3. The waiter calls everyone <b>chefe</b>.</li>
    </ul>
    <div class="pagenum">p. 41</div>
  </div>
  <div class="coffee" style="right:8%;bottom:12%" aria-hidden="true"></div>
</template>

<!-- ===================== LISBON · RIGHT ===================== -->
<template id="tpl-lx-right">
  <div class="pcontent">
    <div class="phead"><span class="city">Miradouros</span><span class="stamp">Dusk &middot; 19:40</span></div>

    <div class="sketchwrap" tabindex="0" role="img" aria-label="Pencil sketch of the rooftops of Alfama at dusk with seagulls">

          <path d="M0 262 Q120 254 230 262 T460 262" stroke-width="1" stroke-dasharray="1 4"></path>
        </g>
        <g class="wash">
          <rect x="0" y="60" width="460" height="200" fill="url(#sunwash)" opacity=".9"></rect>

</template>

<!-- ===================== KYOTO · LEFT ===================== -->
<template id="tpl-ky-left">
  <div class="pcontent">
    <div class="phead"><span class="city">Kyoto</span><span class="stamp">Posted &middot; May 27</span></div>
    <div class="rule"></div>
    <div class="sketchwrap" tabindex="0" role="img" aria-label="Pencil sketch of a torii gate path with pine trees">
      <svg class="sketch" viewBox="0 0 460 300" preserveAspectRatio="xMidYMid meet">
        <g class="pencil-art" filter="url(#wobble)" stroke="#6b6862" fill="none" stroke-width="1.7" stroke-linecap="round">
          <path d="M96 262 L96 96 M214 262 L214 96 M64 96 Q155 74 246 96 M84 118 L226 118 M78 108 L232 108" stroke-width="2"></path>
          <path d="M155 118 L155 262" stroke-width="1.2"></path>
          <path d="M246 262 L420 262" stroke-width="2"></path>
          <path d="M262 262 L262 150 L346 150 L346 262 M262 178 L346 178 M262 206 L346 206 M262 234 L346 234" stroke-width="1.3"></path>
          <path d="M290 262 L290 118 L318 118 L318 262" stroke-width="1.4"></path>
          <path d="M356 262 q4 -60 30 -86 M400 262 q0 -44 22 -58" stroke-width="1.2"></path>
          <path d="M368 176 q16 -14 34 -2 M396 196 q12 -10 26 0" stroke-width="1.1"></path>
        </g>
        <g class="pencil-art" filter="url(#wobble2)" stroke="#4d4a44" fill="none" stroke-width="1.6" stroke-linecap="round">
          <path d="M30 262 q-2 -70 26 -96 q6 30 -2 58 M30 190 q-16 -8 -22 -22 q20 2 28 12 M56 166 q4 -20 -4 -30 q16 8 18 26" stroke-width="1.3"></path>
          <path d="M28 262 L62 262" stroke-width="2.4"></path>
          <path d="M436 262 q10 -34 2 -50" stroke-width="1.2"></path>
          <path d="M0 262 L460 262 L460 274 L0 274 Z" fill="#6b6862" opacity=".14" stroke="none"></path>
        </g>

<script>
(function(){
"use strict";
var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var book=document.getElementById("book");
var staticLeft=document.getElementById("staticLeft");
var staticRight=document.getElementById("staticRight");
var leaf=document.getElementById("leaf");
var leafFront=document.getElementById("leafFront");
var leafBack=document.getElementById("leafBack");
var cornerBtn=document.getElementById("cornerBtn");
var dots=document.querySelectorAll(".dot");

var TPL=[
  {left:"tpl-lx-left",right:"tpl-lx-right",name:"Lisbon"},
  {left:"tpl-ky-left",right:"tpl-ky-right",name:"Kyoto"}
];
var cur=0,turning=false;

function narrow(){return window.matchMedia("(max-width: 660px)").matches;}
function fill(el,tplId){
  var tpl=document.getElementById(tplId);
  el.innerHTML="";
  el.appendChild(tpl.content.cloneNode(true));
}
function render(){
  var next=1-cur;
  fill(staticLeft,TPL[cur].left);
  fill(staticRight,TPL[next].right);
  fill(leafFront,TPL[cur].right);
  fill(leafBack,narrow()?TPL[next].right:TPL[next].left);
  dots.forEach(function(d,i){
    if(i===cur)d.setAttribute("aria-current","true");
    else d.removeAttribute("aria-current");
  });
}
function turn(){
  if(turning)return;
  turning=true;
  leaf.classList.add("turning");
  leaf.setAttribute("aria-hidden","true");
  var dur=RM?420:1180;
  window.setTimeout(function(){
    cur=1-cur;
    render();
    leaf.classList.remove("turning");
    leaf.removeAttribute("aria-hidden");
    turning=false;
  },dur+30);
}
cornerBtn.addEventListener("click",turn);
leaf.addEventListener("click",function(){if(!turning)turn();});
book.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){
    if(e.target===cornerBtn||e.target===book||e.target===document.body){turn();e.preventDefault();}
  }
});
var resizeTimer=null,lastNarrow=narrow();
window.addEventListener("resize",function(){
  window.clearTimeout(resizeTimer);
  resizeTimer=window.setTimeout(function(){
    if(narrow()!==lastNarrow){lastNarrow=narrow();if(!turning)render();}
  },180);
});
render();
})();
</script>
