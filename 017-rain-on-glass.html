<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAINY WINDOW · №017 — Night Glass Study · The Gallery of 100</title>
<style>
:root{
  --wall:    #0c1220;
  --wall-2:  #101827;
  --frame:   #1a2233;
  --frame-2: #0e1523;
  --bokeh-a: #ffb26b;
  --bokeh-b: #6f86b8;
  --mist:    rgba(196,209,228,.42);
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, "Courier New", monospace;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
html{ scrollbar-color:#243248 transparent; }
html::-webkit-scrollbar{ width:9px; }
html::-webkit-scrollbar-thumb{ background:#243248; border-radius:5px; }
body{
  font-family:var(--serif);
  color:#b9c3d4;
  background:
    radial-gradient(1200px 700px at 50% -10%, var(--wall-2), transparent 60%),
    var(--wall);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:clamp(18px,4vh,48px) clamp(14px,4vw,48px) clamp(20px,3vh,36px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{ background:rgba(255,178,107,.35); color:#f4f7fb; }
:focus{ outline:none; }
:focus-visible{ outline:2px dashed rgba(255,178,107,.8); outline-offset:4px; }

/* ---------- room ---------- */
.room{
  width:min(980px, 100%);
  display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2.5vh,26px);
}
.room-head{
  width:100%;
  display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;
  font-family:var(--mono); font-size:.64rem; letter-spacing:.3em; text-transform:uppercase;
  color:rgba(185,195,212,.55);
}
.room-head .no{ color:rgba(255,178,107,.75); }
#clock{ font-variant-numeric:tabular-nums; color:rgba(233,238,245,.85); }

/* ---------- window ---------- */
.window{
  position:relative;
  width:min(880px, 100%);
  aspect-ratio: 5 / 4;
  border-radius:14px;
  background:
    linear-gradient(180deg, #232e44, #131b2c 60%, #0d1322);
  padding:clamp(10px,1.8vw,18px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.05),
    0 30px 70px -30px rgba(0,0,0,.9),
    0 2px 0 rgba(255,255,255,.04) inset,
    0 -14px 40px -22px rgba(0,0,0,.8) inset;
}
/* wall light spill from the glass */
.window::after{
  content:""; position:absolute; inset:-40px;
  background:radial-gradient(50% 42% at 50% 46%, rgba(111,134,184,.10), transparent 70%);
  pointer-events:none;
  z-index:-1;
}
.glass{
  position:relative;
  width:100%; height:100%;
  border-radius:6px;
  overflow:hidden;
  background:#0a101d;
  cursor:crosshair;
  touch-action:none;
}
.glass canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#bokehCanvas{ filter:blur(10px) saturate(1.15); transform:scale(1.06); transition:filter .4s ease; }
body.flashing #bokehCanvas{ filter:blur(10px) saturate(1.3) brightness(1.8); }
#fogCanvas{ opacity:.9; }
#rainCanvas{ z-index:3; }
/* glass sheen + interior reflection */
.sheen{
  position:absolute; inset:0; z-index:4; pointer-events:none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.075) 0%, rgba(255,255,255,.015) 22%, transparent 40%),
    linear-gradient(295deg, rgba(255,255,255,.05) 0%, transparent 30%);
}
.sheen::after{
  content:""; position:absolute; left:8%; top:6%; width:26%; height:60%;
  background:linear-gradient(160deg, rgba(255,255,255,.06), transparent 70%);
  border-radius:50%;
  transform:rotate(-18deg);
  filter:blur(6px);
}
/* muntin bars */
.muntin{ position:absolute; z-index:5; pointer-events:none; background:linear-gradient(180deg, #2a3750, #1a2233); box-shadow:0 0 8px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.08) inset; }
.muntin.h{ left:0; right:0; top:calc(58% - 4px); height:8px; }
.muntin.v{ top:0; bottom:0; left:calc(43% - 4px); width:8px; }
/* faint interior silhouette reflected in glass */
.reflect{
  position:absolute; z-index:4; pointer-events:none;
  right:6%; bottom:4%;
  opacity:.10;
}

/* ---------- lightning flash ---------- */
.flash{
  position:absolute; inset:0; z-index:6; pointer-events:none;
  background:linear-gradient(180deg, rgba(214,228,252,.9), rgba(214,228,252,.5));
  opacity:0; mix-blend-mode:screen;
}

/* ---------- sill ---------- */
.sill{
  width:min(880px,100%);
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding:12px clamp(14px,2.5vw,22px);
  border-radius:8px;
  background:linear-gradient(180deg, #1d2740, #141c30);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 16px 30px -18px rgba(0,0,0,.9);
}
.sill .hint{ font-family:var(--mono); font-size:.62rem; letter-spacing:.24em; text-transform:uppercase; color:rgba(185,195,212,.5); }
.sill .hint em{ font-style:normal; color:rgba(255,178,107,.8); }
.rain-btn{
  font-family:var(--mono); font-size:.62rem; letter-spacing:.26em; text-transform:uppercase;
  color:#c9d3e4;
  background:linear-gradient(180deg, #243252, #182238);
  border:1px solid rgba(185,195,212,.25);
  border-radius:999px;
  padding:11px 20px;
  cursor:pointer;
  display:inline-flex; align-items:center; gap:10px;
  transition:border-color .3s ease, box-shadow .3s ease, color .3s ease, transform .2s ease;
  touch-action:manipulation;
}
.rain-btn:hover{ transform:translateY(-2px); border-color:rgba(255,178,107,.6); }
.rain-btn[aria-pressed="true"]{
  border-color:var(--bokeh-a);
  color:#ffe9cf;
  box-shadow:0 0 16px rgba(255,178,107,.35);
}
.rain-btn .dot{
  width:8px; height:8px; border-radius:50%;
  background:#3a4a66;
  transition:background .3s ease, box-shadow .3s ease;
}
.rain-btn[aria-pressed="true"] .dot{ background:var(--bokeh-a); box-shadow:0 0 8px rgba(255,178,107,.9); }

/* ---------- poem ---------- */
.poem{
  text-align:center;
  max-width:56ch;
  font-style:italic;
  font-size:clamp(1.02rem, 2vw, 1.35rem);
  line-height:1.85;
  color:#aeb9cc;
  padding:clamp(6px,1.5vh,14px) 0 0;
}
.poem .line{ display:block; }
.poem .soft{ color:#7e8aa0; font-size:.82em; }
.poem .amber{ color:var(--bokeh-a); }

/* ---------- colophon ---------- */
.colophon{
  margin-top:auto;
  padding-top:clamp(16px,3vh,30px);
  font-family:var(--mono); font-size:.6rem; letter-spacing:.3em; text-transform:uppercase;
  color:rgba(185,195,212,.4);
  display:flex; gap:20px; flex-wrap:wrap; justify-content:center;
}
.colophon .a{ color:rgba(255,178,107,.6); }

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:clamp(18px,4vh,36px);
  transform:translate(-50%,8px);
  font-family:var(--mono); font-size:.6rem; letter-spacing:.26em; text-transform:uppercase;
  color:#e7edf6;
  background:rgba(13,19,34,.9);
  border:1px solid rgba(185,195,212,.3);
  border-radius:999px;
  padding:8px 16px;
  opacity:0; transition:opacity .35s ease, transform .35s ease;
  pointer-events:none; z-index:20;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- responsive ---------- */
@media (max-width:560px){
  .window{ aspect-ratio: 4 / 5; }
  .muntin.v{ left:calc(38% - 4px); }
  .room-head{ justify-content:center; text-align:center; }
}
@media (prefers-reduced-motion: reduce){
  .rain-btn{ transition:none; }
  .toast{ transition:none; }
}
</style>
</head>
<body>

<div class="room">

  <header class="room-head">
    <span>RAINY WINDOW · <span class="no">№017</span></span>
    <span id="clock">--:-- · RAIN 82%</span>
    <span>NIGHT GLASS STUDY</span>
  </header>

  <div class="window">
    <div class="glass" id="glass">
      <canvas id="bokehCanvas" aria-hidden="true"></canvas>
      <canvas id="fogCanvas" aria-hidden="true"></canvas>
      <canvas id="rainCanvas" aria-hidden="true"></canvas>
      <div class="sheen" aria-hidden="true"></div>
      <svg class="reflect" viewBox="0 0 120 90" width="120" height="90" aria-hidden="true">
        <path d="M18 84 Q22 50 18 34 M18 34 Q30 30 34 40 M18 40 Q8 36 6 46 M34 40 Q42 34 46 44" fill="none" stroke="#dfe8f5" stroke-width="2.2" stroke-linecap="round"></path>
        <rect x="6" y="84" width="46" height="4" rx="2" fill="#dfe8f5"></rect>
        <circle cx="92" cy="30" r="10" fill="none" stroke="#dfe8f5" stroke-width="2"></circle>
        <path d="M92 40 v22 M92 46 l-8 -6 M92 46 l8 -6 M92 54 l-9 -6 M92 54 l9 -6" stroke="#dfe8f5" stroke-width="2" fill="none"></path>
      </svg>
      <div class="muntin h" aria-hidden="true"></div>
      <div class="muntin v" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>
    </div>
  </div>

  <div class="sill">
    <span class="hint"><em>DRAG</em> TO WIPE THE FOG · DROPS MERGE WHEN THEY MEET</span>
    <button class="rain-btn" id="rainBtn" type="button" aria-pressed="false">
      <span class="dot" aria-hidden="true"></span>
      Rain sound · Off
    </button>
  </div>

  <p class="poem">
    <span class="line">The city rehearses its lights for no one at all,</span>
    <span class="line">and the rain, <span class="soft">patient editor,</span></span>
    <span class="line">blurs every draft <span class="amber">to something kinder.</span></span>
  </p>

  <footer class="colophon">
    <span>Rainy Window</span>
    <span class="a">№017 of 100</span>
    <span>The Gallery of 100</span>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
var lerp = function(a,b,t){ return a + (b-a)*t; };
var rnd = function(a,b){ return a + Math.random()*(b-a); };
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

/* ================= dom ================= */
var glass = document.getElementById("glass");
var bokehCv = document.getElementById("bokehCanvas");
var fogCv = document.getElementById("fogCanvas");
var rainCv = document.getElementById("rainCanvas");
var bctx = bokehCv.getContext("2d");
var fctx = fogCv.getContext("2d");
var rctx = rainCv.getContext("2d");
var flash = document.getElementById("flash");
var clockEl = document.getElementById("clock");
var rainBtn = document.getElementById("rainBtn");
var toast = document.getElementById("toast");

var W=0, H=0, DPR=1;

/* ================= bokeh (pre-rendered once) ================= */
var bokehLights = [];
function buildBokeh(){
  bokehLights = [];
  /* far skyline dots */
  var n = 46;
  for (var i = 0; i < n; i++){
    var warm = Math.random() < 0.62;
    bokehLights.push({
      x: rnd(0.02, 0.98),
      y: rnd(0.25, 0.96) * (1 - Math.abs(rnd(-1,1))*0.3),
      r: rnd(4, 26) * (W > 600 ? 1 : 0.8),
      warm: warm,
      a: rnd(0.25, 0.85),
      pulse: rnd(0, 6.28)
    });
  }
  /* a few big near blobs */
  for (var j = 0; j < 7; j++){
    bokehLights.push({
      x: rnd(0.05, 0.95), y: rnd(0.35, 0.95),
      r: rnd(28, 58), warm: Math.random() < 0.5,
      a: rnd(0.18, 0.4), pulse: rnd(0, 6.28)
    });
  }
}
function drawBokeh(t){
  var g = bctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0b1526");
  g.addColorStop(0.55, "#101d33");
  g.addColorStop(1, "#0a111e");
  bctx.fillStyle = g;
  bctx.fillRect(0, 0, W, H);
  /* skyline silhouette */
  bctx.fillStyle = "rgba(6,10,18,.85)";
  var bx = 0;
  var seed = 3;
  while (bx < W){
    var bw = 30 + ((bx * 7 + seed) % 60);
    var bh = H * (0.18 + (((bx * 13 + seed) % 100) / 100) * 0.34);
    bctx.fillRect(bx, H - bh, bw + 1, bh);
    bx += bw;
  }
  /* lights */
  for (var i = 0; i < bokehLights.length; i++){
    var L = bokehLights[i];
    var tw = 0.75 + 0.25 * Math.sin(t * 0.0006 + L.pulse);
    var col = L.warm ? "255,178,107" : (Math.random() < 0.5 ? "111,134,184" : "159,196,226");
    var rg = bctx.createRadialGradient(L.x*W, L.y*H, 0, L.x*W, L.y*H, L.r);
    rg.addColorStop(0, "rgba(" + col + "," + (L.a * tw).toFixed(3) + ")");
    rg.addColorStop(0.6, "rgba(" + col + "," + (L.a * tw * 0.45).toFixed(3) + ")");
    rg.addColorStop(1, "rgba(" + col + ",0)");
    bctx.fillStyle = rg;
    bctx.beginPath();
    bctx.arc(L.x*W, L.y*H, L.r, 0, 6.283);
    bctx.fill();
  }
}

/* ================= fog layer ================= */
function fogBase(){
  fctx.globalCompositeOperation = "source-over";
  var g = fctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "rgba(206,217,233,.52)");
  g.addColorStop(0.5, "rgba(196,209,228,.38)");
  g.addColorStop(1, "rgba(186,200,222,.30)");
  fctx.fillStyle = g;
  fctx.fillRect(0, 0, W, H);
  /* patchy thickness */
  for (var i = 0; i < 26; i++){
    var fx = rnd(0, W), fy = rnd(0, H), fr = rnd(40, 150);
    var rg = fctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
    rg.addColorStop(0, "rgba(214,224,238,.10)");
    rg.addColorStop(1, "rgba(214,224,238,0)");
    fctx.fillStyle = rg;
    fctx.fillRect(fx - fr, fy - fr, fr*2, fr*2);
  }
}
function fogRegen(dt){
  fctx.globalCompositeOperation = "source-over";
  fctx.fillStyle = "rgba(200,213,232," + (0.004 * dt).toFixed(4) + ")";
  fctx.fillRect(0, 0, W, H);
}
function wipeFog(x, y){
  fctx.globalCompositeOperation = "destination-out";
  var r = Math.max(34, Math.min(W, H) * 0.075);
  var g = fctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(0,0,0,.95)");
  g.addColorStop(0.65, "rgba(0,0,0,.55)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  fctx.fillStyle = g;
  fctx.beginPath();
  fctx.arc(x, y, r, 0, 6.283);
  fctx.fill();
}

/* ================= rain drops ================= */
var drops = [];
var MAX_DROPS = 90;
function spawnDrop(init){
  var big = Math.random() < 0.18;
  return {
    x: rnd(0, W),
    y: init ? rnd(0, H) : rnd(-40, -6),
    r: big ? rnd(2.6, 4.2) : rnd(1.1, 2.4),
    vy: big ? rnd(1.5, 2.4) : rnd(0.45, 1.25),
    wob: rnd(0, 6.28),
    wobSpd: rnd(0.02, 0.06),
    amp: rnd(0.1, 0.5),
    drift: rnd(-0.12, 0.3),
    px: 0, py: 0
  };
}
function seedDrops(){
  drops = [];
  var n = Math.round(clamp(W * H / 14000, 30, MAX_DROPS));
  for (var i = 0; i < n; i++) drops.push(spawnDrop(true));
}
function updateDrops(dt, t){
  rctx.clearRect(0, 0, W, H);
  /* trails + heads, painterly order: trail first */
  for (var i = 0; i < drops.length; i++){
    var d = drops[i];
    d.px = d.x; d.py = d.y;
    d.wob += d.wobSpd * dt;
    d.y += d.vy * dt;
    d.x += (Math.sin(d.wob) * d.amp + d.drift) * dt;
    if (d.y > H + 20){
      drops[i] = spawnDrop(false);
      continue;
    }
    if (d.x < -10) d.x = W + 8;
    if (d.x > W + 10) d.x = -8;
    /* trail: vertical streak with gradient alpha */
    var tl = d.r * (7 + d.vy * 3);
    var tg = rctx.createLinearGradient(d.x, d.y - tl, d.x, d.y);
    tg.addColorStop(0, "rgba(190,205,228,0)");
    tg.addColorStop(0.7, "rgba(190,205,228,.10)");
    tg.addColorStop(1, "rgba(210,222,240,.22)");
    rctx.strokeStyle = tg;
    rctx.lineWidth = d.r * 0.9;
    rctx.beginPath();
    rctx.moveTo(d.x, d.y - tl);
    rctx.lineTo(d.x, d.y);
    rctx.stroke();
    /* head: glass lens */
    rctx.beginPath();
    rctx.ellipse(d.x, d.y, d.r * 0.8, d.r * 1.35, 0, 0, 6.283);
    rctx.fillStyle = "rgba(224,234,248,.30)";
    rctx.fill();
    rctx.strokeStyle = "rgba(240,246,253,.35)";
    rctx.lineWidth = 0.8;
    rctx.stroke();
    /* refraction highlight */
    rctx.beginPath();
    rctx.arc(d.x - d.r*0.25, d.y - d.r*0.45, d.r*0.32, 0, 6.283);
    rctx.fillStyle = "rgba(255,255,255,.55)";
    rctx.fill();
  }
  /* merging: O(n^2) with n<=90 is fine, every other frame */
  if ((frame & 1) === 0){
    for (var a = 0; a < drops.length; a++){
      var p = drops[a];
      if (p.vy < 0.4) continue;
      for (var b = a + 1; b < drops.length; b++){
        var q = drops[b];
        var dx = p.x - q.x, dy = p.y - q.y;
        var rr = (p.r + q.r) * 1.6;
        if (dx*dx + dy*dy < rr*rr){
          /* absorb smaller into bigger, respawn only the loser */
          var keep, lose, loseIdx;
          if (p.r >= q.r){ keep = p; lose = q; loseIdx = b; }
          else { keep = q; lose = p; loseIdx = a; }
          keep.r = Math.min(5.4, Math.sqrt(keep.r*keep.r + lose.r*lose.r*0.8));
          keep.vy = clamp(keep.vy + lose.vy * 0.25, 0.45, 3.6);
          keep.x = (p.x + q.x) / 2;
          drops[loseIdx] = spawnDrop(false);
          drops[loseIdx].y = rnd(-40, -6);
          break;
        }
      }
    }
  }
}

/* ================= lightning ================= */
var nextBolt = 8000;
function maybeLightning(now, dt){
  nextBolt -= dt * 16.7;
  if (nextBolt > 0) return;
  nextBolt = rnd(9000, 21000);
  if (reduced.matches){
    flash.style.opacity = "0.18";
    setTimeout(function(){ flash.style.opacity = "0"; }, 260);
    return;
  }
  document.body.classList.add("flashing");
  var seq = [
    [0.85, 60], [0.1, 70], [0.55, 90], [0.05, 80], [0.30, 140], [0, 10]
  ];
  var acc = 0;
  for (var i = 0; i < seq.length; i++){
    (function(op, delay){
      setTimeout(function(){
        flash.style.opacity = String(op);
        if (op === 0) document.body.classList.remove("flashing");
      }, acc);
      acc += delay;
    })(seq[i][0], seq[i][1]);
  }
}

/* ================= clock ================= */
function updateClock(){
  var now = new Date();
  var pad = function(n){ return (n<10?"0":"") + n; };
  var intensity = 70 + Math.round(Math.sin(now.getMinutes() / 60 * 6.283) * 14);
  clockEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + " · RAIN " + intensity + "%";
}

/* ================= audio ================= */
var AC = null, rainGain = null;
function ensureAudio(){
  if (AC) return true;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return false;
  AC = new Ctor();
  var len = AC.sampleRate * 3;
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var data = buf.getChannelData(0);
  var last = 0;
  for (var i = 0; i < len; i++){
    var w = Math.random() * 2 - 1;
    last = (last + 0.025 * w) / 1.025;
    data[i] = last * 3.1;
  }
  var src = AC.createBufferSource();
  src.buffer = buf; src.loop = true;
  var lp = AC.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 1600; lp.Q.value = 0.3;
  var hp = AC.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 380;
  rainGain = AC.createGain();
  rainGain.gain.value = 0.0001;
  src.connect(hp); hp.connect(lp); lp.connect(rainGain);
  rainGain.connect(AC.destination);
  src.start();
  /* slow intensity LFO */
  var lfo = AC.createOscillator();
  lfo.type = "sine"; lfo.frequency.value = 0.05;
  var lg = AC.createGain(); lg.gain.value = 240;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  return true;
}
function setRain(on){
  if (on){
    if (!ensureAudio()){ showToast("AUDIO UNAVAILABLE"); return; }
    if (AC.state === "suspended") AC.resume();
    rainGain.gain.setTargetAtTime(0.34, AC.currentTime, 1.2);
    rainBtn.setAttribute("aria-pressed", "true");
    rainBtn.lastChild.textContent = " Rain sound · On";
    showToast("RAIN · STEADY");
  } else {
    if (AC) rainGain.gain.setTargetAtTime(0.0001, AC.currentTime, 0.7);
    rainBtn.setAttribute("aria-pressed", "false");
    rainBtn.lastChild.textContent = " Rain sound · Off";
    showToast("RAIN · SILENCE");
  }
}
rainBtn.addEventListener("click", function(){
  setRain(rainBtn.getAttribute("aria-pressed") !== "true");
});

/* ================= toast ================= */
var toastTimer = 0;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 1800);
}

/* ================= pointer wiping ================= */
var wiping = false, lastWipe = {x:-99, y:-99};
function localXY(e){
  var r = glass.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
glass.addEventListener("pointerdown", function(e){
  wiping = true;
  try { glass.setPointerCapture(e.pointerId); } catch(err){}
  var p = localXY(e);
  wipeFog(p.x, p.y);
  e.preventDefault();
});
glass.addEventListener("pointermove", function(e){
  if (!wiping) return;
  var p = localXY(e);
  /* interpolate between last and current for smooth strokes */
  var dx = p.x - lastWipe.x, dy = p.y - lastWipe.y;
  var dist = Math.sqrt(dx*dx + dy*dy);
  var steps = Math.max(1, Math.min(8, Math.round(dist / 18)));
  for (var i = 1; i <= steps; i++){
    wipeFog(lastWipe.x + dx * i / steps, lastWipe.y + dy * i / steps);
  }
  lastWipe = p;
});
var endWipe = function(e){
  wiping = false;
  try { glass.releasePointerCapture(e.pointerId); } catch(err){}
};
glass.addEventListener("pointerup", endWipe);
glass.addEventListener("pointercancel", endWipe);

/* ================= sizing ================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  var r = glass.getBoundingClientRect();
  W = Math.max(120, Math.round(r.width));
  H = Math.max(120, Math.round(r.height));
  [bokehCv, fogCv, rainCv].forEach(function(c){
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
  });
  bctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.setTransform(DPR,0,0,DPR,0,0);
  rctx.setTransform(DPR,0,0,DPR,0,0);
  buildBokeh();
  drawBokeh(performance.now());
  fogBase();
  seedDrops();
}

/* ================= loop ================= */
var raf = 0, running = true, frame = 0, lastT = 0, clockTick = 0;
function step(now){
  if (!running) return;
  raf = requestAnimationFrame(step);
  frame++;
  var dt = clamp((now - lastT) / 16.7, 0.2, 2.5);
  lastT = now;
  updateDrops(dt, now);
  if (!reduced.matches){
    fogRegen(dt * (wiping ? 0.35 : 1));
  }
  maybeLightning(now, dt);
  clockTick += dt * 16.7;
  if (clockTick > 2000){ clockTick = 0; updateClock(); }
}

/* ================= events ================= */
var resizeTimer = 0;
window.addEventListener("resize", function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 160);
});
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ running = false; cancelAnimationFrame(raf); }
  else if (!running){ running = true; lastT = performance.now(); raf = requestAnimationFrame(step); }
});
window.addEventListener("pagehide", function(){
  running = false; cancelAnimationFrame(raf);
  if (AC){ try { AC.close(); } catch(e){} }
});
window.addEventListener("keydown", function(e){
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "r" || e.key === "R"){
    fogBase();
    showToast("FOG · RECONDED");
  }
});

/* ================= boot ================= */
resize();
updateClock();
lastT = performance.now();
raf = requestAnimationFrame(step);
})();
</script>
